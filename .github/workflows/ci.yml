name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require INVARIANT-CHANGE trailer for protected paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before SHA (initial push) — skip protected-path diff"
              exit 0
            fi
          fi
          # CI-03 (#44): this gate twice reported the trailer missing while its
          # own log had just printed it - once on 2026-08-02 (396 occurrences in
          # the echoed commit bodies) and once on 2026-08-06 (7). Both passed on
          # an unchanged re-run. The old form was:
          #
          #   MSGS=$(git log --format=%B "$BASE..$HEAD")
          #   echo "$MSGS"
          #   if ! echo "$MSGS" | grep -q 'INVARIANT-CHANGE:'; then
          #
          # I could not identify why that pipeline fails. A SIGPIPE/pipefail
          # race was the obvious candidate - grep -q exits on first match while
          # echo is still writing - but 300 local trials at the same payload
          # size never reproduced it, so that explanation is unproven and is not
          # being claimed here.
          #
          # Rather than patch a mechanism nobody has demonstrated, the fragile
          # construct is gone: git does the matching itself, so there is no
          # pipeline, no echo of a large variable, and nothing to race. That
          # removes the whole class whatever the cause was.
          #
          # A nondeterministic gate is worse than a missing one - green stops
          # being evidence (R-0007), and a control that refuses correct work
          # trains people to re-run it until it agrees (R-0005).
          PROTECTED_RE='^(tests/invariants/|\.importlinter$)'
          # Diff from the MERGE BASE, not from the base branch tip.
          #
          # `git diff BASE HEAD` answers "how do these two commits differ", which
          # is not the question. When main moves ahead, a file main changed and
          # this branch simply does not have yet shows up as changed here - and
          # the gate blames the PR for it. Measured on #82: main's 51501c2
          # touched tests/invariants/test_boundaries.py, the PR touched nothing
          # protected, and the gate still refused it. Its own diagnostic printed
          # the contradiction - "Protected paths touched: test_boundaries.py"
          # directly above an empty list of commits touching them.
          #
          # A control that refuses correct work is a failure, not a win (R-0005),
          # and this one refused every PR that fell behind main.
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD" || true)
          TOUCHED=$(printf '%s\n' "$CHANGED" | grep -E "$PROTECTED_RE" || true)

          if [ -z "$TOUCHED" ]; then
            echo "No protected paths touched"
            exit 0
          fi

          echo "Protected paths touched:"
          printf '  %s\n' $TOUCHED
          echo
          echo "Commits in $MERGE_BASE..$HEAD that touch them:"
          git log --format='  %h %s' "$MERGE_BASE..$HEAD" -- tests/invariants/ .importlinter

          # git greps its own commit bodies. No shell pipeline in the decision.
          WITH_TRAILER=$(git log --format=%h --grep='INVARIANT-CHANGE:' "$MERGE_BASE..$HEAD")
          echo
          echo "Commits carrying an INVARIANT-CHANGE: trailer:"
          if [ -n "$WITH_TRAILER" ]; then
            git log --format='  %h %s' --grep='INVARIANT-CHANGE:' "$MERGE_BASE..$HEAD"
          else
            echo "  (none)"
          fi

          if [ -z "$WITH_TRAILER" ]; then
            echo "::error::Protected path changed without INVARIANT-CHANGE: <reason> in commit body"
            echo "::error::Add the trailer to the commit that touches tests/invariants/ or .importlinter"
            exit 1
          fi
          echo
          echo "OK - protected-path change is declared"

  contract-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject hand-authored OpenAPI without Cortex sha256 pin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          # Prefer current pin; keep older specs checked when present.
          for SPEC in contract/openapi-1.9.0.json contract/openapi-1.5.0.json contract/openapi-1.2.0.json contract/openapi-1.1.0.json contract/openapi-1.0.0.json; do
            HASH="${SPEC}.sha256"
            if [ -f "$SPEC" ]; then
              found=1
              if [ ! -f "$HASH" ]; then
                echo "::error::$SPEC exists without sibling $HASH"
                exit 1
              fi
              ACTUAL=$(sha256sum "$SPEC" | awk '{print $1}')
              EXPECTED=$(awk '{print $1}' "$HASH")
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::$HASH does not match $SPEC"
                exit 1
              fi
              echo "Pinned OpenAPI ok: $SPEC $ACTUAL"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No vendored OpenAPI — run scripts/sync_contract.py"
            exit 1
          fi
          if [ ! -f contract/openapi-1.9.0.json ]; then
            echo "::error::Missing current pin contract/openapi-1.9.0.json — run scripts/sync_contract.py"
            exit 1
          fi
          VEC=contract/testvectors/manifest_canonical.jsonl
          if [ ! -f "$VEC" ]; then
            echo "::error::missing $VEC"
            exit 1
          fi

  # F-TBD-42. pytest is 96 to 97 percent of what used to be one job (22.0 to
  # 26.6 min on four PR heads, 2026-11-13, against the 30 minute cap). The suite
  # now runs as three shards, each on its own runner with the same cap. Nothing
  # is deselected: every shard asks pytest itself for the collected test files,
  # in pytest's own order, and takes every third one (scripts/ci_pytest_shard.sh).
  # lint-type-test proves on every run that the three shards collect exactly the
  # ids `pytest tests/` collects, and fails if any shard is not green.
  # One pytest process per runner, as before: the shards share no filesystem,
  # so the shared default DuckDB file is not shared between them.
  pytest:
    name: pytest (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [protected-paths, contract-pin]
    strategy:
      # A red shard must not hide another shard's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          # secrets.GITHUB_TOKEN is scoped to the repo the workflow runs in, so
          # it cannot read the private Netie-AI/Cortex and the API answers 404
          # rather than 403. Everything downstream - ruff, mypy, import-linter,
          # the test suite - sat behind this step and had never run.
          # This is CI-02 option A. Option C (install the published wheel and
          # delete this step) is the long-term answer, and must not land before
          # Netie-AI/Cortex#5 or a packaging bug presents as a crypto bug.
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger" -e "./packages/ao_vendor"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Invariant + unit tests (shard ${{ matrix.shard }} of 3)
        shell: bash
        env:
          # Control-plane suite hard-fails without Postgres (R-0002). This job has
          # no compose service yet; skip is an explicit decision, not a silent green.
          # Add a postgres service job before flipping this off.
          DMS_SKIP_CONTROL_PLANE_TESTS: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          # ONTO-DATA-01: tests/test_onto_data_01.py runs here. No skip.
          # DEF-VALIDATE-01: tests/test_def_validate_01.py runs here. No skip.
          bash scripts/ci_pytest_shard.sh files ${{ matrix.shard }} 3 > "$RUNNER_TEMP/shard_files.txt"
          echo "shard ${{ matrix.shard }} of 3: $(wc -l < "$RUNNER_TEMP/shard_files.txt") test files"
          xargs -a "$RUNNER_TEMP/shard_files.txt" python -m pytest -q --tb=short

  # R1-LIVE-FIX-01. Boots the API on the seeded Postgres and GETs every
  # page-load path. A 4xx or 5xx fails the job. lint-type-test waits on it.
  live-pages-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [protected-paths, contract-pin]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dms -d dms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql://dms:dms@127.0.0.1:5432/dms
      DMS_DEMO_FALLBACK: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger" -e "./packages/ao_vendor"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Boot the API and GET every page-load path
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          # STUDIO-FIX-A. The pytest shards skip control_plane. This job has
          # the Postgres service, so the sources route is checked here before
          # the page-load smoke. The test drops schema dms; the API migrates
          # again on boot.
          python -m pytest tests/control_plane/test_studio_fix_a_pg.py tests/control_plane/test_fde_tenant_01_pg.py -q --tb=short -p no:cacheprovider
          python -m uvicorn dms_api.app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "API exited during startup"
              cat "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "API did not answer /health"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          fi
          python scripts/verify/live_pages_smoke.py --base http://127.0.0.1:8000

  # R2-CONNECT-CORE-01. Postgres is the connection store and a source.
  # MariaDB is the second source. The pytest shards skip these engine cases.
  connect-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dms
          POSTGRES_PASSWORD: dms
          POSTGRES_DB: dms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dms -d dms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-mariadb
          MARIADB_DATABASE: connect_src
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql://dms:dms@127.0.0.1:5432/dms
      DMS_CONNECT_V2_ENGINES: "1"
      CONNECT_V2_PG_HOST: 127.0.0.1
      CONNECT_V2_PG_PORT: "5432"
      CONNECT_V2_PG_USER: dms
      CONNECT_V2_PG_PASSWORD: dms
      CONNECT_V2_PG_DB: connect_src
      CONNECT_V2_MY_HOST: 127.0.0.1
      CONNECT_V2_MY_PORT: "3306"
      CONNECT_V2_MY_USER: root
      CONNECT_V2_MY_PASSWORD: ci-only-mariadb
      CONNECT_V2_MY_DB: connect_src
      CONNECT_V2_NOPERM_PASSWORD: ci-only-noperm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger" -e "./packages/ao_vendor"
          pip install -e ".[dev]"
          pip install "PyMySQL>=1.1"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Connect v2 against Postgres and MariaDB
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          python -m pytest tests/test_connect_v2.py -q --tb=short -p no:cacheprovider

  # FEAT-CONNECT-GAUSS-01. openGauss must connect. A dead container fails
  # this job and prints its logs. opengauss/opengauss is MulanPSL-2.0.
  # gvenzl/oracle-free packages Oracle Database Free (Oracle Free Use Terms),
  # not a paid edition. It skips with a named reason when the image will not
  # pull or the database never becomes ready. A live probe failure fails the job.
  connect-gauss-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger" -e "./packages/ao_vendor"
          pip install -e ".[dev,gauss,oracle]"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Probe when the images are available
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          # The 5.0.0 entrypoint exits unless GS_PASSWORD has upper, lower,
          # digit, and one of #?!@$%^&*-. Generate it here. Never commit it.
          python - << 'PY'
          import secrets
          import string
          from pathlib import Path
          special = "@"
          chars = [
              secrets.choice(string.ascii_uppercase),
              secrets.choice(string.ascii_lowercase),
              secrets.choice(string.digits),
              special,
          ]
          pool = string.ascii_letters + string.digits + special
          chars.extend(secrets.choice(pool) for _ in range(16))
          secrets.SystemRandom().shuffle(chars)
          path = Path("/tmp/dms-gs-password")
          path.write_text("".join(chars), encoding="utf-8")
          path.chmod(0o600)
          PY
          GS_PASSWORD="$(cat /tmp/dms-gs-password)"
          export GS_PASSWORD
          redact_gauss_logs() {
            python - << 'PY'
          import subprocess
          from pathlib import Path
          pw = ""
          path = Path("/tmp/dms-gs-password")
          if path.exists():
              pw = path.read_text(encoding="utf-8")
          proc = subprocess.run(["docker", "logs", "opengauss"], capture_output=True)
          text = proc.stdout.decode("utf-8", "replace") + proc.stderr.decode("utf-8", "replace")
          if pw:
              text = text.replace(pw, "[redacted]")
          print(text[-24000:])
          PY
          }
          fail_gauss() {
            echo "openGauss failed: $1"
            redact_gauss_logs
            docker inspect opengauss --format 'status={{.State.Status}} exit={{.State.ExitCode}}' || true
            exit 1
          }
          if ! timeout 180 docker pull opengauss/opengauss:5.0.0; then
            echo "openGauss image pull failed"
            exit 1
          fi
          docker rm -f opengauss >/dev/null 2>&1 || true
          # Image listens on 5432. Host 15432 is the documented mapping.
          # --privileged is the image's own start requirement.
          # OTHER_PG_CONF is appended after the entrypoint's sha256 line, so
          # the last value is MD5 and psycopg 3 can log in.
          if ! docker run -d --name opengauss --privileged \
            -p 15432:5432 \
            -e GS_PASSWORD \
            -e GS_HOST_AUTH_METHOD=md5 \
            -e OTHER_PG_CONF='password_encryption_type = 0' \
            opengauss/opengauss:5.0.0; then
            fail_gauss "docker run failed"
          fi
          # Entrypoint initdb prints "ready for start up", then execs gaussdb.
          # gs_ctl "server is running" is the signal after that. 240 * 2s covers
          # a cold init on a GitHub runner. The loop returns as soon as it is up.
          # gs_ctl refuses root. Run it as the data-dir owner. This image's
          # DB login is opengauss; the OS account is whoever owns PGDATA.
          ready=0
          last_ctl=""
          owner=""
          for _ in $(seq 1 240); do
            running="$(docker inspect -f '{{.State.Running}}' opengauss 2>/dev/null || echo false)"
            if [ "$running" != "true" ]; then
              echo "data owner: ${owner:-unknown}"
              echo "last gs_ctl: ${last_ctl:-none}"
              fail_gauss "container exited before gs_ctl reported the server running"
            fi
            # The entrypoint's temporary server also reports running, then
            # it stops. Accept gs_ctl only after init prints this line.
            init_line="$(docker logs opengauss 2>&1 | grep -F 'ready for start up' || true)"
            if [ -z "$init_line" ]; then
              sleep 2
              continue
            fi
            owner="$(docker exec opengauss stat -c '%U' /var/lib/opengauss/data 2>/dev/null || true)"
            if [ -n "$owner" ] && [ "$owner" != "root" ]; then
              last_ctl="$(docker exec -u "$owner" \
                -e PATH="/usr/local/opengauss/bin:/usr/bin:/bin" \
                -e LD_LIBRARY_PATH="/usr/local/opengauss/lib" \
                -e GAUSSHOME="/usr/local/opengauss" \
                opengauss gs_ctl status -D /var/lib/opengauss/data 2>&1 || true)"
              case "$last_ctl" in
                *"server is running"*) ready=1; break ;;
              esac
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "data owner: ${owner:-unknown}"
            echo "last gs_ctl: ${last_ctl:-none}"
            fail_gauss "gs_ctl did not report server is running within 8 minutes"
          fi
          # Published port must accept a connection after gs_ctl is green.
          port_ready=0
          for _ in $(seq 1 30); do
            if python -c 'import socket; s=socket.create_connection(("127.0.0.1",15432),2); s.close()'; then
              port_ready=1
              break
            fi
            sleep 2
          done
          if [ "$port_ready" != 1 ]; then
            fail_gauss "gs_ctl is running but host port 15432 is closed"
          fi
          # gsql to 127.0.0.1 returns "Operation now in progress" on this
          # image. Seed the one fixture row through the published port.
          seed_rc=0
          seed_out="$(python - << 'PY'
          import os
          import time
          import psycopg
          password = os.environ["GS_PASSWORD"]
          last = "no attempt"
          ok = False
          for _ in range(15):
              try:
                  with psycopg.connect(
                      host="127.0.0.1",
                      port=15432,
                      user="gaussdb",
                      password=password,
                      dbname="postgres",
                      connect_timeout=10,
                  ) as con:
                      shown = con.execute("SHOW sql_compatibility").fetchone()
                      print("sql_compatibility", None if shown is None else shown[0])
                      con.execute("CREATE TABLE public.dms_probe (n int)")
                      con.execute("INSERT INTO public.dms_probe (n) VALUES (1)")
                      con.commit()
                  ok = True
                  break
              except Exception as exc:
                  last = str(exc).replace(password, "[redacted]")
                  time.sleep(2)
          if not ok:
              raise SystemExit(last)
          PY
          )" || seed_rc=$?
          echo "seed note: ${seed_out//$GS_PASSWORD/[redacted]}"
          if [ "$seed_rc" != 0 ]; then
            fail_gauss "could not create the probe table"
          fi
          export DMS_CONNECT_GAUSS_LIVE=1
          export CONNECT_GAUSS_HOST=127.0.0.1
          export CONNECT_GAUSS_PORT=15432
          # Remote login as the initial user is refused:
          # "Forbid remote connection with initial user".
          export CONNECT_GAUSS_USER=gaussdb
          export CONNECT_GAUSS_DB=postgres
          export CONNECT_GAUSS_PASSWORD="$GS_PASSWORD"
          oracle=0
          export ORACLE_PASSWORD=Ci_only_Oracle1
          redact_oracle_logs() {
            python - << 'PY'
          import os
          import subprocess
          pw = os.environ.get("ORACLE_PASSWORD", "")
          proc = subprocess.run(["docker", "logs", "oracle-free"], capture_output=True)
          text = (proc.stdout + proc.stderr).decode("utf-8", "replace")
          if pw:
              text = text.replace(pw, "[redacted]")
          print(text[-24000:])
          PY
          }
          if timeout 180 docker pull gvenzl/oracle-free:23-slim; then
            docker rm -f oracle-free >/dev/null 2>&1 || true
            if docker run -d --name oracle-free -p 1521:1521 \
              -e ORACLE_PASSWORD gvenzl/oracle-free:23-slim; then
              oracle=1
            else
              echo "skipped: oracle free container did not start"
            fi
          else
            echo "skipped: oracle free image unavailable"
          fi
          if [ "$oracle" = 1 ]; then
            # The image opens port 1521 before the database is open.
            # "DATABASE IS READY TO USE" is the real ready line. 90 * 8s.
            ready=0
            ora_reason=""
            for _ in $(seq 1 90); do
              running="$(docker inspect -f '{{.State.Running}}' oracle-free 2>/dev/null || echo false)"
              if [ "$running" != "true" ]; then
                ora_reason="oracle free container exited before ready"
                break
              fi
              if docker logs oracle-free 2>&1 | grep -F 'DATABASE IS READY TO USE' >/dev/null; then
                ready=1
                break
              fi
              sleep 8
            done
            if [ "$ready" != 1 ] && [ -z "$ora_reason" ]; then
              ora_reason="oracle free did not become ready"
            fi
            if [ -n "$ora_reason" ]; then
              echo "skipped: ${ora_reason}"
              redact_oracle_logs
            else
              export DMS_CONNECT_ORACLE_LIVE=1
              export CONNECT_ORACLE_HOST=127.0.0.1
              export CONNECT_ORACLE_PORT=1521
              export CONNECT_ORACLE_USER=system
              export CONNECT_ORACLE_DB=FREEPDB1
              export CONNECT_ORACLE_PASSWORD="$ORACLE_PASSWORD"
            fi
          fi
          if ! python -m pytest tests/test_connect_gauss_oracle_01.py -q --tb=short -p no:cacheprovider -k live_gauss; then
            redact_gauss_logs
            exit 1
          fi
          if [ "${DMS_CONNECT_ORACLE_LIVE:-}" = 1 ]; then
            python -m pytest tests/test_connect_gauss_oracle_01.py -q --tb=short -p no:cacheprovider -k live_oracle
          fi

  lint-type-test:
    runs-on: ubuntu-latest
    # The cap dates from when pytest ran inside this job (18.5 min on main
    # a52ccb2, then 22 to 27 min). pytest now runs in the `pytest` shards above
    # and this job takes about a minute. The cap is not raised.
    timeout-minutes: 30
    # This job keeps its name and stays the single gate: it is red unless the
    # two gates, every pytest shard, the live-pages smoke, and connect-v2 are
    # green. `!cancelled()` is needed so a failed shard makes this job FAIL.
    # Without it the job would be skipped, and a skipped required check counts
    # as passing.
    needs: [protected-paths, contract-pin, pytest, live-pages-smoke, connect-v2]
    if: ${{ !cancelled() }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Require the gates and every pytest shard
        shell: bash
        run: |
          set -euo pipefail
          echo "protected-paths=${{ needs.protected-paths.result }} contract-pin=${{ needs.contract-pin.result }} pytest=${{ needs.pytest.result }} live-pages-smoke=${{ needs.live-pages-smoke.result }} connect-v2=${{ needs.connect-v2.result }}"
          if [ "${{ needs.protected-paths.result }}" != "success" ] || [ "${{ needs.contract-pin.result }}" != "success" ] || [ "${{ needs.pytest.result }}" != "success" ] || [ "${{ needs.live-pages-smoke.result }}" != "success" ] || [ "${{ needs.connect-v2.result }}" != "success" ]; then
            echo "::error::a required job is not green (see the line above)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          # secrets.GITHUB_TOKEN is scoped to the repo the workflow runs in, so
          # it cannot read the private Netie-AI/Cortex and the API answers 404
          # rather than 403. Everything downstream - ruff, mypy, import-linter,
          # the test suite - sat behind this step and had never run.
          # This is CI-02 option A. Option C (install the published wheel and
          # delete this step) is the long-term answer, and must not land before
          # Netie-AI/Cortex#5 or a packaging bug presents as a crypto bug.
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger" -e "./packages/ao_vendor"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Ruff
        run: ruff check apps packages tests

      - name: Mypy
        run: mypy apps/api/dms_api packages/core/dms_core packages/cortex_client/cortex_client packages/executor/dms_executor packages/ledger/dms_ledger

      - name: Import linter
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          lint-imports

      - name: The pytest shards run exactly the suite (no test dropped or run twice)
        shell: bash
        env:
          DMS_SKIP_CONTROL_PLANE_TESTS: "1"
        run: |
          set -euo pipefail
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger:${PWD}/packages/ao_vendor"
          bash scripts/ci_pytest_shard.sh verify 3

      - name: grade52 metric self-test (stack-free, not a score)
        run: python scripts/verify/grade52.py --self-test

      - name: Live pages smoke self-check (path list, not a booted API)
        run: python scripts/verify/live_pages_smoke.py --self-check

      - name: Oracle self-test (stack-free, not live ask)
        # F42 / EPIC-018: recomputes hostile-pack oracles. Does not POST /v1/chat/ask.
        run: python scripts/score_answers.py --docs tests/fixtures/hostile_score --oracle-only

      - name: SCORE-BIRD self-check (stack-free, not live ask)
        # SCORE-BIRD-01 #184. Pack honesty + judge plants. Does not POST /v1/chat/ask.
        run: python scripts/score_bird.py --self-check

      - name: BENCH-MATRIX self-check (stack-free, not live ask)
        # BENCH-MATRIX-01. Five synthetic questions. Does not POST /v1/chat/ask.
        run: python scripts/bench_matrix.py --self-check

      - name: BIRD harness self-check (stack-free, not a download)
        # BIRD-HARNESS-CI-01. Synthetic sqlite. Does not fetch Mini-Dev.
        run: python scripts/bench/bird/__main__.py self-check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Studio result view tests
        # STUDIO-RESULT-01 (#365). Vitest was not a CI step. This runs the
        # result-view file only. It does not score answers or call /ask.
        # R1-UI-CLARIFY-01 adds the clarify card tests and a mocked Playwright
        # spec. It does not score answers.
        working-directory: apps/ui
        run: |
          npm ci
          npx vitest run src/components/studio/ResultView.test.ts src/components/studio/AskStages.test.ts src/components/answerStamp.test.ts src/components/AnswerMessage.test.ts src/lib/copy.test.ts src/lib/reasonCopy.test.ts src/lib/ontologyRead.test.ts src/components/studio/clarifyCards.test.tsx src/lib/clarifyAsk.test.ts
          npx playwright install --with-deps chromium
          npx playwright test e2e/clarify.spec.ts

  # BANK-04 (#271). Brings the appliance compose stack up and asserts the TLS
  # contract against the live containers: HTTPS answers /health, plain HTTP does
  # not serve /v1/*, compose refuses to start without the database password, the
  # only published port is Caddy's, and files mode serves a supplied certificate.
  # The behaviour lives in scripts/compose_tls_smoke.sh so it runs the same on a
  # workstation with Docker. Runs in parallel with the other jobs; no existing
  # job or gate changes.
  compose-tls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Nothing in this job pushes or writes to the repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # apps/api/Dockerfile installs cortex-contract, which is private and on no
      # index. Same sparse checkout and token as lint-type-test (CI-02 option A),
      # then the wheel goes into deploy/wheelhouse/ for the image build.
      # persist-credentials: false keeps the token out of _cortex/.git/config for
      # the rest of the job; the wheel build needs no git auth, and .dockerignore
      # keeps _cortex/ and .git out of the image build context.
      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build cortex-contract wheel into the API image wheelhouse
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel --outdir deploy/wheelhouse ./_cortex/packages/cortex_contract

      - name: Launcher password reader matches compose (.env semantics)
        # Start-DMSStack.ps1 reads DMS_DB_PASSWORD the way compose does; this
        # self-check pins that. pwsh is preinstalled on ubuntu-latest.
        run: pwsh -NoProfile -File scripts/windows/Test-GetDmsDbPassword.ps1

      - name: Compose TLS smoke
        # Throwaway password and certificate are generated inside the script.
        # CI is the build proof for apps/api/Dockerfile: no REUSE_IMAGE here.
        run: bash scripts/compose_tls_smoke.sh

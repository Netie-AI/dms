name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require INVARIANT-CHANGE trailer for protected paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before SHA (initial push) — skip protected-path diff"
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(tests/invariants/|\.importlinter$)' >/dev/null; then
            echo "Protected path touched — checking commit bodies for INVARIANT-CHANGE:"
            MSGS=$(git log --format=%B "$BASE..$HEAD")
            echo "$MSGS"
            if ! echo "$MSGS" | grep -q 'INVARIANT-CHANGE:'; then
              echo "::error::Protected path changed without INVARIANT-CHANGE: <reason> in commit body"
              exit 1
            fi
          else
            echo "No protected paths touched"
          fi

  contract-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject hand-authored OpenAPI without Cortex sha256 pin
        shell: bash
        run: |
          set -euo pipefail
          SPEC="contract/openapi-1.0.0.json"
          HASH="contract/openapi-1.0.0.json.sha256"
          if [ -f "$SPEC" ]; then
            if [ ! -f "$HASH" ]; then
              echo "::error::$SPEC exists without sibling $HASH — export from Cortex R1, do not hand-author"
              exit 1
            fi
            # .sha256 must verify the spec bytes (Cortex release pin)
            if command -v sha256sum >/dev/null; then
              ACTUAL=$(sha256sum "$SPEC" | awk '{print $1}')
            else
              ACTUAL=$(shasum -a 256 "$SPEC" | awk '{print $1}')
            fi
            EXPECTED=$(awk '{print $1}' "$HASH")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::$HASH does not match $SPEC (actual=$ACTUAL expected=$EXPECTED)"
              exit 1
            fi
            echo "Pinned OpenAPI ok: $ACTUAL"
          else
            echo "No vendored OpenAPI (stub client mode) — ok"
          fi

  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [protected-paths, contract-pin]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings

      - name: Ruff
        run: ruff check apps packages tests

      - name: Mypy
        run: mypy apps/api/dms_api packages/core/dms_core packages/cortex_client/cortex_client packages/executor/dms_executor packages/ledger/dms_ledger

      - name: Import linter
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          lint-imports

      - name: Invariant + unit tests
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          python -m pytest tests/ -q --tb=short

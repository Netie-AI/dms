name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require INVARIANT-CHANGE trailer for protected paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before SHA (initial push) — skip protected-path diff"
              exit 0
            fi
          fi
          # CI-03 (#44): this gate twice reported the trailer missing while its
          # own log had just printed it - once on 2026-08-02 (396 occurrences in
          # the echoed commit bodies) and once on 2026-08-06 (7). Both passed on
          # an unchanged re-run. The old form was:
          #
          #   MSGS=$(git log --format=%B "$BASE..$HEAD")
          #   echo "$MSGS"
          #   if ! echo "$MSGS" | grep -q 'INVARIANT-CHANGE:'; then
          #
          # I could not identify why that pipeline fails. A SIGPIPE/pipefail
          # race was the obvious candidate - grep -q exits on first match while
          # echo is still writing - but 300 local trials at the same payload
          # size never reproduced it, so that explanation is unproven and is not
          # being claimed here.
          #
          # Rather than patch a mechanism nobody has demonstrated, the fragile
          # construct is gone: git does the matching itself, so there is no
          # pipeline, no echo of a large variable, and nothing to race. That
          # removes the whole class whatever the cause was.
          #
          # A nondeterministic gate is worse than a missing one - green stops
          # being evidence (R-0007), and a control that refuses correct work
          # trains people to re-run it until it agrees (R-0005).
          PROTECTED_RE='^(tests/invariants/|\.importlinter$)'
          # Diff from the MERGE BASE, not from the base branch tip.
          #
          # `git diff BASE HEAD` answers "how do these two commits differ", which
          # is not the question. When main moves ahead, a file main changed and
          # this branch simply does not have yet shows up as changed here - and
          # the gate blames the PR for it. Measured on #82: main's 51501c2
          # touched tests/invariants/test_boundaries.py, the PR touched nothing
          # protected, and the gate still refused it. Its own diagnostic printed
          # the contradiction - "Protected paths touched: test_boundaries.py"
          # directly above an empty list of commits touching them.
          #
          # A control that refuses correct work is a failure, not a win (R-0005),
          # and this one refused every PR that fell behind main.
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD" || true)
          TOUCHED=$(printf '%s\n' "$CHANGED" | grep -E "$PROTECTED_RE" || true)

          if [ -z "$TOUCHED" ]; then
            echo "No protected paths touched"
            exit 0
          fi

          echo "Protected paths touched:"
          printf '  %s\n' $TOUCHED
          echo
          echo "Commits in $MERGE_BASE..$HEAD that touch them:"
          git log --format='  %h %s' "$MERGE_BASE..$HEAD" -- tests/invariants/ .importlinter

          # git greps its own commit bodies. No shell pipeline in the decision.
          WITH_TRAILER=$(git log --format=%h --grep='INVARIANT-CHANGE:' "$MERGE_BASE..$HEAD")
          echo
          echo "Commits carrying an INVARIANT-CHANGE: trailer:"
          if [ -n "$WITH_TRAILER" ]; then
            git log --format='  %h %s' --grep='INVARIANT-CHANGE:' "$MERGE_BASE..$HEAD"
          else
            echo "  (none)"
          fi

          if [ -z "$WITH_TRAILER" ]; then
            echo "::error::Protected path changed without INVARIANT-CHANGE: <reason> in commit body"
            echo "::error::Add the trailer to the commit that touches tests/invariants/ or .importlinter"
            exit 1
          fi
          echo
          echo "OK - protected-path change is declared"

  contract-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject hand-authored OpenAPI without Cortex sha256 pin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          # Prefer current pin; keep older specs checked when present.
          for SPEC in contract/openapi-1.2.0.json contract/openapi-1.1.0.json contract/openapi-1.0.0.json; do
            HASH="${SPEC}.sha256"
            if [ -f "$SPEC" ]; then
              found=1
              if [ ! -f "$HASH" ]; then
                echo "::error::$SPEC exists without sibling $HASH"
                exit 1
              fi
              ACTUAL=$(sha256sum "$SPEC" | awk '{print $1}')
              EXPECTED=$(awk '{print $1}' "$HASH")
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::$HASH does not match $SPEC"
                exit 1
              fi
              echo "Pinned OpenAPI ok: $SPEC $ACTUAL"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No vendored OpenAPI — run scripts/sync_contract.py"
            exit 1
          fi
          if [ ! -f contract/openapi-1.2.0.json ]; then
            echo "::error::Missing current pin contract/openapi-1.2.0.json — run scripts/sync_contract.py"
            exit 1
          fi
          VEC=contract/testvectors/manifest_canonical.jsonl
          if [ ! -f "$VEC" ]; then
            echo "::error::missing $VEC"
            exit 1
          fi

  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [protected-paths, contract-pin]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout cortex-contract package
        uses: actions/checkout@v4
        with:
          repository: Netie-AI/Cortex
          path: _cortex
          sparse-checkout: |
            packages/cortex_contract
          sparse-checkout-cone-mode: true
          # secrets.GITHUB_TOKEN is scoped to the repo the workflow runs in, so
          # it cannot read the private Netie-AI/Cortex and the API answers 404
          # rather than 403. Everything downstream - ruff, mypy, import-linter,
          # the test suite - sat behind this step and had never run.
          # This is CI-02 option A. Option C (install the published wheel and
          # delete this step) is the long-term answer, and must not land before
          # Netie-AI/Cortex#5 or a packaging bug presents as a crypto bug.
          token: ${{ secrets.CORTEX_CONTRACT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel build
          python -m build --wheel ./_cortex/packages/cortex_contract
          pip install ./_cortex/packages/cortex_contract/dist/cortex_contract-*.whl
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings cryptography

      - name: Ruff
        run: ruff check apps packages tests

      - name: Mypy
        run: mypy apps/api/dms_api packages/core/dms_core packages/cortex_client/cortex_client packages/executor/dms_executor packages/ledger/dms_ledger

      - name: Import linter
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          lint-imports

      - name: Invariant + unit tests
        env:
          # Control-plane suite hard-fails without Postgres (R-0002). This job has
          # no compose service yet; skip is an explicit decision, not a silent green.
          # Add a postgres service job before flipping this off.
          DMS_SKIP_CONTROL_PLANE_TESTS: "1"
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          python -m pytest tests/ -q --tb=short

      - name: Oracle self-test (stack-free, not live ask)
        # F42 / EPIC-018: recomputes hostile-pack oracles. Does not POST /v1/chat/ask.
        run: python scripts/score_answers.py --docs tests/fixtures/hostile_score --oracle-only

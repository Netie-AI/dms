name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require INVARIANT-CHANGE trailer for protected paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              echo "No before SHA (initial push) — skip protected-path diff"
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -E '^(tests/invariants/|\.importlinter$)' >/dev/null; then
            echo "Protected path touched — checking commit bodies for INVARIANT-CHANGE:"
            MSGS=$(git log --format=%B "$BASE..$HEAD")
            echo "$MSGS"
            if ! echo "$MSGS" | grep -q 'INVARIANT-CHANGE:'; then
              echo "::error::Protected path changed without INVARIANT-CHANGE: <reason> in commit body"
              exit 1
            fi
          else
            echo "No protected paths touched"
          fi

  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [protected-paths]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e "./packages/core" -e "./packages/cortex_client" -e "./packages/executor" -e "./packages/ledger"
          pip install -e ".[dev]"
          pip install fastapi uvicorn httpx pydantic-settings

      - name: Ruff
        run: ruff check apps packages tests

      - name: Mypy
        run: mypy apps/api/dms_api packages/core/dms_core packages/cortex_client/cortex_client packages/executor/dms_executor packages/ledger/dms_ledger

      - name: Import linter
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          lint-imports

      - name: Invariant + unit tests
        run: |
          export PYTHONPATH="${PWD}/apps/api:${PWD}/packages/core:${PWD}/packages/cortex_client:${PWD}/packages/executor:${PWD}/packages/ledger"
          python -m pytest tests/ -q --tb=short

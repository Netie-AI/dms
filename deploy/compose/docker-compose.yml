# Integration pin point: Cortex engine image tag + DMS API/UI.
# Engine upgrade = change cortex image tag. Contract major stays 1.
# Caddy is the only public port on the appliance (T6).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
      POSTGRES_DB: dms
    # Architecture §1: Caddy is the only public port — do not publish 5432 on the host.
    # Local psql: docker compose exec postgres psql -U dms -d dms
    # Need host bind for GUI clients? temporarily: ports: ["5432:5432"]
    expose:
      - "5432"
    volumes:
      - dms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://dms:dms@postgres:5432/dms
      CORTEX_URL: ${CORTEX_URL:-http://host.docker.internal:8010}
      OPENVAULT_URL: ${OPENVAULT_URL:-http://host.docker.internal:5000}
      DMS_ASK_MODE: ${DMS_ASK_MODE:-live}
      DMS_DEMO_FALLBACK: ${DMS_DEMO_FALLBACK:-0}
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1,http://localhost
    # Not published on host when Caddy is used — internal only
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    image: caddy:2-alpine
    volumes:
      - ../../apps/ui/dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:8080"
    depends_on:
      - api

  # Optional: expose API directly for Vite proxy during local UI dev
  api_dev:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://dms:dms@postgres:5432/dms
      CORTEX_URL: ${CORTEX_URL:-http://host.docker.internal:8010}
      OPENVAULT_URL: ${OPENVAULT_URL:-http://host.docker.internal:5000}
      DMS_ASK_MODE: ${DMS_ASK_MODE:-live}
      DMS_DEMO_FALLBACK: ${DMS_DEMO_FALLBACK:-0}
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dms_pg:

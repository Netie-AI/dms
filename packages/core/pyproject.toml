[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-core"
version = "0.1.0"
description = "DMS shared ports, compliance gate, domain types"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dms_core*"]

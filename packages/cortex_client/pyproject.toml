[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-cortex-client"
version = "0.1.0"
description = "Thin HTTP client for Cortex (stub until sync-contract from published OpenAPI)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_client*"]

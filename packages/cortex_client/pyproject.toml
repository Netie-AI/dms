[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-cortex-client"
version = "0.1.1"
description = "HTTP client for cortex-contract 1.1.0 (openapi-python-client generated)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "cortex-contract==1.1.0",
  "attrs>=23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex_client*"]

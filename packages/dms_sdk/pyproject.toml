[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-sdk"
version = "0.1.0"
description = "Typed HTTP client and CLI for DMS. Does nothing until called."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
dms = "dms_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dms_sdk*"]

# Retrieve spine: slot names only. Compile stays verified demo_ontology Python.
# Not certified_queries.yaml. Not a vendor (DB-GPT/n8n/...) pack format.
kind: dms.ontology_spine
source: demo_ontology
not_certified_sql: true
objects:
  - transaction
  - shipment
  - supplier
  - location
  - alert
  - lot
  - product
measures:
  - outbound_value_myr
  - outbound_kg
  - net_movement_kg
  - stock_value_myr
  - shipping_cost_myr
  - shipment_count
  - sku_count
  - utilisation_pct
  - below_reorder_lots
  - supplier_rank_score
  - audit_overdue
# Cortex Insights ranking uses pack metric ids. Same-intent only onto
# verified demo_ontology measures. Not certified SQL. Not a skip to a
# weaker unrelated measure (stock_value_* never becomes sku_count).
# No alerts / delayed / storage_bin aliases — those have no honest DMS
# measure (planted refuse stays ABSTAIN). supplier_ranking maps to the
# verified risk+lead score, not sku_count.
# Named supply-chain grains (SC-ONTOLOGY-01): sku/plant alias objects;
# lane/day are declared when columns exist. Slot names only. No SQL.
grains:
  sku: product
  supplier: supplier
  plant: location
  lane: lane
  day: day
measure_aliases:
  stock_value_by_category: stock_value_myr
  spend_by_country: stock_value_myr
  total_spend: stock_value_myr
  cq_capacity_utilisation: utilisation_pct
  capacity_utilisation: utilisation_pct
  cq_capacity_above_90: utilisation_pct
  capacity_above_90: utilisation_pct
  cq_cold_storage: utilisation_pct
  cold_storage: utilisation_pct
  cq_cctv_wh_a: utilisation_pct
  cctv_wh_a: utilisation_pct
  cq_cost_by_destination: shipping_cost_myr
  cost_by_destination: shipping_cost_myr
  shipment_cost_by_destination: shipping_cost_myr
  cq_low_stock_wh_a: below_reorder_lots
  low_stock_wh_a: below_reorder_lots
  cq_sku_count_by_category: sku_count
  sku_count_by_category: sku_count
  cq_sales_top5_value: outbound_value_myr
  sales_top5_value: outbound_value_myr
  cq_sales_top3_volume: outbound_kg
  sales_top3_volume: outbound_kg
  cq_top3_category_sales: outbound_value_myr
  top3_category_sales: outbound_value_myr
  cq_expired_items: stock_value_myr
  expired_items: stock_value_myr
  cq_chemicals_list: stock_value_myr
  chemicals_list: stock_value_myr
  cq_sku_count: sku_count
  cq_supplier_ranking: supplier_rank_score
  supplier_ranking: supplier_rank_score
  cq_audit_overdue: audit_overdue
  audit_overdue: audit_overdue

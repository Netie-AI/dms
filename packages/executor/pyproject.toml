[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-executor"
version = "0.1.0"
description = "DMS query execution + manifest minting (DuckDB / submit live here only)"
requires-python = ">=3.11"
dependencies = [
  "dms-core",
  "dms-cortex-client",
  "cortex-contract>=1.2.0,<2",
  "cryptography>=42",
  "httpx>=0.27",
  "duckdb>=1.0,<2",
  "pytz>=2024.1",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  # SQL parser for the currency unit gate (dms_executor.sql_currency). Swap:
  # Cortex HTTP verify-unit, or another dialect parser behind that module.
  "sqlglot>=27.0.0,<28",
  # DMS_ML_STUDIO (default off). Classical models on aggregated frames.
  # Swap: another CPU library with the same fit and held-out metrics.
  # ETS is implemented here. Swap for that piece: statsmodels Holt-Winters.
  "scikit-learn>=1.4,<1.8",
  # Charts on the results card. Swap: another PNG writer.
  "pillow>=10,<12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dms_executor*"]

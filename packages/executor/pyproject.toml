[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms-executor"
version = "0.1.0"
description = "DMS query execution + manifest minting (DuckDB / submit live here only)"
requires-python = ">=3.11"
dependencies = [
  "dms-core",
  "dms-cortex-client",
  "cortex-contract==1.1.0",
  "cryptography>=42",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dms_executor*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "Netie DMS — ChatGPT for Excel & databases (consumer of Cortex engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Netie" }]
dependencies = [
  "dms-core",
  "dms-cortex-client",
  "dms-executor",
  "dms-ledger",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.8",
  "ruff>=0.3",
  "import-linter>=2.0",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/core", "packages/cortex_client", "packages/executor", "packages/ledger"]
include = ["dms_api*", "dms_core*", "cortex_client*", "dms_executor*", "dms_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/core",
  "packages/cortex_client",
  "packages/executor",
  "packages/ledger",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["dms_api", "dms_core", "cortex_client", "dms_executor", "dms_ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

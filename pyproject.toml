[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dms"
version = "0.1.0"
description = "Netie DMS — ChatGPT for Excel & databases (consumer of Cortex engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Netie" }]
dependencies = [
  "dms-core",
  "dms-cortex-client",
  "dms-executor",
  "dms-ledger",
  "cortex-contract>=1.2.0,<2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "cryptography>=42",
  "duckdb>=1.0",
  "python-multipart>=0.0.9",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  # pandas.DataFrame.to_parquet in scripts/load_adventureworks.py --extract
  "pyarrow>=14",
]

[project.optional-dependencies]
# Live source-database drivers for dms_executor.db_connector. Optional because
# the connector imports them lazily and its tests run against a fake DB-API
# connection — CI needs neither driver, a deployment that reads a real source
# needs the one matching its source. pyodbc additionally needs the system
# msodbcsql18 driver; the legacy Windows "SQL Server" driver cannot reach
# Azure SQL, which requires TLS 1.2.
sources = [
  "pyodbc>=5.1",
  "PyMySQL>=1.1",
]
dev = [
  "pytest>=8.0",
  "mypy>=1.8",
  "ruff>=0.3",
  "import-linter>=2.0",
  # scripts/brief.py writes the pptx and tests/test_insights_brief.py reads it back.
  # Declared here rather than guarded with a skip: the deck read-back is the gate that
  # asserts the artifact the customer receives (R-0001), and a skipped test is a failing
  # test (R-0002). If the dependency is absent the suite must go red, not quiet.
  "python-pptx>=0.6.23",
]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/core", "packages/cortex_client", "packages/executor", "packages/ledger"]
include = ["dms_api*", "dms_core*", "cortex_client*", "dms_executor*", "dms_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api",
  "packages/core",
  "packages/cortex_client",
  "packages/executor",
  "packages/ledger",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["dms_api", "dms_core", "cortex_client", "dms_executor", "dms_ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The OpenAPI client is regenerated by scripts/sync_contract.py and must never be
# hand-edited (R-0009), so lint findings inside it are not actionable. Its
# formatting also depended on ruff being on PATH during generation, which made CI
# non-deterministic. Excluding it makes the gate depend only on hand-written code.
extend-exclude = ["packages/cortex_client/cortex_client/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

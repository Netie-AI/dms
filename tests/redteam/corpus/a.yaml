- id: A-026
  family: a
  space: finance
  question: "By category, what is the stock value of SKUs that have outbound sales?"
  model_sql: >-
    WITH sold AS (
      SELECT sku, quantity_kg FROM transactions WHERE txn_type = 'outbound'
    )
    SELECT i.category, SUM(i.quantity_kg * i.unit_cost_myr) AS stock_value
    FROM inventory i JOIN sold ON sold.sku = i.sku
    GROUP BY i.category
  expect: answer
  gold_sql: >-
    SELECT category, SUM(quantity_kg * unit_cost_myr) AS stock_value FROM inventory
    WHERE sku IN (SELECT sku FROM transactions WHERE txn_type = 'outbound')
    GROUP BY category
  gold_notes: "Every SKU in stock has sold; stock value per category counted once per stock line."
  trap: "Fan-out hidden in a tidy CTE: 'sold' has one row per outbound transaction, then it is joined to inventory and the inventory value is summed. Each inventory line repeats per transaction. KEPT AS A CAUGHT TRAP FOR THE WRONG REASON: in the dev run the gate refused it as validate:ungranted:sold (the CTE name read as an ungranted relation), not because it saw a fan-out."

- id: A-027
  family: a
  space: ops
  question: "What is the total shipping cost by category?"
  model_sql: >-
    SELECT i.category, SUM(s.cost_myr) AS total_shipping_cost
    FROM shipments s JOIN inventory i ON i.sku = s.sku
    GROUP BY i.category
  expect: answer
  gold_sql: >-
    SELECT p.category, SUM(s.cost_myr) AS total_shipping_cost
    FROM shipments s
    JOIN (SELECT sku, MIN(category) AS category FROM inventory GROUP BY sku) p ON p.sku = s.sku
    GROUP BY p.category
  gold_notes: "A SKU has exactly one category; collapse inventory to one row per SKU before joining. SKU-ALPHA and SKU-GAMMA have two lots each in this data."
  trap: "The most natural phrasing there is: a shipment measure grouped by a SKU attribute that lives only on the lot-level inventory table. Correct on the unextended seed, wrong as soon as any SKU has two lots."

- id: A-028

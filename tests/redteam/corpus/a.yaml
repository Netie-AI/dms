  model_sql: >-
    SELECT SUM(t.quantity_kg * t.unit_cost_myr) AS outbound_value
    FROM transactions t JOIN inventory i ON i.sku = t.sku
    WHERE i.category = 'PACKAGING' AND t.txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) AS outbound_value FROM transactions
    WHERE txn_type = 'outbound'
      AND sku IN (SELECT sku FROM inventory WHERE category = 'PACKAGING')
  gold_notes: "Category lives only on inventory, which holds one row per stock lot; SKU-ALPHA has two lots in this data."
  trap: "Join only to reach an attribute (category). Looks like a harmless lookup join; inventory has no key so any SKU stocked in two places doubles its sales. The seed alone has no such SKU: the duplicate only exists in the extension data."


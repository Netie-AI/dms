# Attacker A: join fan-out and double counting. Data: seed + a.ext.sql.
# ---------------------------------------------------------------- TRAPS
- id: A-001
  family: a
  space: finance
  question: "What is the total stock quantity in kg for SKUs that had outbound sales?"
  model_sql: >-
    SELECT SUM(i.quantity_kg) AS total_stock_kg
    FROM inventory i JOIN transactions t ON t.sku = i.sku
    WHERE t.txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_stock_kg FROM inventory
    WHERE sku IN (SELECT sku FROM transactions WHERE txn_type = 'outbound')
  gold_notes: "Each stock line counts once. The join repeats every stock line once per outbound transaction of its SKU."
  trap: "A model needs 'SKUs with outbound sales', reaches for a join to transactions and sums the inventory column straight off the joined rows: classic parent-measure-after-child-join."

- id: A-002
  family: a
  space: finance
  question: "What is the average reorder level in kg across inventory records for SKUs that have outbound sales?"
  model_sql: >-
    SELECT AVG(i.reorder_level_kg) AS avg_reorder_level_kg
    FROM inventory i JOIN transactions t ON t.sku = i.sku
    WHERE t.txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT AVG(reorder_level_kg) AS avg_reorder_level_kg FROM inventory
    WHERE sku IN (SELECT sku FROM transactions WHERE txn_type = 'outbound')
  gold_notes: "Plain average over the inventory records of qualifying SKUs. After the join each record is weighted by its SKU's outbound transaction count."
  trap: "AVG after fan-out: the same join as a SUM question, but the result is a weighted mean that looks perfectly plausible (no inflated magnitude to eyeball)."

- id: A-003
  family: a
  space: finance
  question: "What is the total value of stock held for SKUs with more than 500 kg of outbound sales?"
  model_sql: >-
    SELECT SUM(busy.stock_value) AS total_stock_value FROM (
      SELECT i.sku,
             SUM(i.quantity_kg * i.unit_cost_myr) AS stock_value,
             SUM(t.quantity_kg) AS sold_kg
      FROM inventory i JOIN transactions t ON t.sku = i.sku
      WHERE t.txn_type = 'outbound'
      GROUP BY i.sku
      HAVING SUM(t.quantity_kg) > 500
    ) busy
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) AS total_stock_value FROM inventory
    WHERE sku IN (SELECT sku FROM transactions WHERE txn_type = 'outbound'
                  GROUP BY sku HAVING SUM(quantity_kg) > 500)
  gold_notes: "Qualifying SKUs have more than 500 kg outbound; stock value counts each inventory line once."
  trap: "Fan-out hidden inside an inline view: the HAVING on the transaction sum is correct, and the same GROUP BY quietly multiplies the inventory value by the number of outbound transactions. The outer SELECT looks like a clean one-table SUM. (First draft used a WITH clause; the gate refused every CTE for an unrelated reason, so this is the inline-view form.)"

- id: A-004
  family: a
  space: finance
  ask_path: product
  question: "For each category, what is the stock quantity in kg and the outbound quantity in kg?"
  model_sql: >-
    SELECT i.category, SUM(i.quantity_kg) AS stock_kg, SUM(t.quantity_kg) AS outbound_kg
    FROM inventory i JOIN transactions t ON t.sku = i.sku
    WHERE t.txn_type = 'outbound'
    GROUP BY i.category
  expect: answer
  gold_sql: >-
    WITH s AS (SELECT category, SUM(quantity_kg) AS stock_kg FROM inventory GROUP BY category),
         o AS (SELECT p.category, SUM(t.quantity_kg) AS outbound_kg
               FROM transactions t
               JOIN (SELECT DISTINCT sku, category FROM inventory) p ON p.sku = t.sku
               WHERE t.txn_type = 'outbound' GROUP BY p.category)
    SELECT s.category, s.stock_kg, COALESCE(o.outbound_kg, 0) AS outbound_kg
    FROM s LEFT JOIN o ON o.category = s.category
  gold_notes: "Two measures from two different grains (stock lines, transactions) must be aggregated separately then joined on category. Also an inner join would drop categories with no outbound movement."
  trap: "Cross-multiplication: both measures asked in one sentence, one flat join, two SUMs. Stock is multiplied by transaction count, outbound by lot count. A model writes this by default for 'X and Y by category'."

- id: A-005

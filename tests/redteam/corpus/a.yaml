- id: A-029
  family: a
  space: finance
  question: "What is the total outbound sales value by supplier?"
  model_sql: >-
    SELECT s.supplier_name, SUM(t.quantity_kg * t.unit_cost_myr) AS outbound_value
    FROM transactions t
    JOIN inventory i ON i.sku = t.sku
    JOIN suppliers s ON s.supplier_id = i.supplier_id
    WHERE t.txn_type = 'outbound'
    GROUP BY s.supplier_name
  expect: answer
  gold_sql: >-
    SELECT s.supplier_name, SUM(t.quantity_kg * t.unit_cost_myr) AS outbound_value
    FROM transactions t
    JOIN inventory i ON i.sku = t.sku AND i.location_id = t.location_id
    JOIN suppliers s ON s.supplier_id = i.supplier_id
    WHERE t.txn_type = 'outbound'
    GROUP BY s.supplier_name
  gold_notes: "A stock lot is (sku, warehouse, supplier); a transaction carries sku and warehouse so it identifies its lot and so its supplier. Joining on sku alone lets SKU-ALPHA's sales count for both suppliers."
  trap: "Two-hop attribution (transaction to lot to supplier) joined on sku only. Looks like the obvious chain; SKU-ALPHA has two suppliers (extension data) so its sales are double counted and shared out wrongly."

- id: A-030

- id: A-009
  family: a
  space: ops
  question: "By warehouse, what is the total stock quantity in kg and the total quantity in kg of shipments heading there?"
  model_sql: >-
    SELECT l.location_code, SUM(i.quantity_kg) AS stock_kg, SUM(s.quantity_kg) AS shipment_kg
    FROM locations l
    JOIN inventory i ON i.location_id = l.location_id
    JOIN shipments s ON s.destination_location_id = l.location_id
    GROUP BY l.location_code
  expect: answer
  gold_sql: >-
    WITH st AS (SELECT location_id, SUM(quantity_kg) AS stock_kg FROM inventory GROUP BY location_id),
         sh AS (SELECT destination_location_id AS location_id, SUM(quantity_kg) AS shipment_kg
                FROM shipments GROUP BY destination_location_id)
    SELECT l.location_code, COALESCE(st.stock_kg, 0) AS stock_kg, COALESCE(sh.shipment_kg, 0) AS shipment_kg
    FROM locations l
    LEFT JOIN st ON st.location_id = l.location_id
    LEFT JOIN sh ON sh.location_id = l.location_id
    WHERE st.location_id IS NOT NULL OR sh.location_id IS NOT NULL
  gold_notes: "Warehouses with stock or shipments, zero for the missing side. Warehouses E, F and G hold stock but receive no shipments (the inner joins drop them)."
  trap: "Two child tables hanging off one parent (locations): the flat three-way join multiplies stock by shipments and shipments by stock lines, and the inner joins drop warehouses with only one side."

- id: A-010
  family: a
  space: company
  question: "For each warehouse, how many open alerts and how many stock lines are there?"
  model_sql: >-
    SELECT l.location_code, COUNT(a.alert_id) AS open_alerts, COUNT(i.sku) AS stock_lines
    FROM locations l
    LEFT JOIN alerts a ON a.location_id = l.location_id AND a.resolved = FALSE
    LEFT JOIN inventory i ON i.location_id = l.location_id
    GROUP BY l.location_code
  expect: answer
  gold_sql: >-
    WITH a AS (SELECT location_id, COUNT(*) AS open_alerts FROM alerts WHERE resolved = FALSE GROUP BY location_id),
         s AS (SELECT location_id, COUNT(*) AS stock_lines FROM inventory GROUP BY location_id)
    SELECT l.location_code, COALESCE(a.open_alerts, 0) AS open_alerts, COALESCE(s.stock_lines, 0) AS stock_lines
    FROM locations l
    LEFT JOIN a ON a.location_id = l.location_id
    LEFT JOIN s ON s.location_id = l.location_id
  gold_notes: "Both counts are per warehouse; the LEFT JOINs are right, the missing pre-aggregation is the bug."
  trap: "COUNT over two LEFT JOINed children of one parent: LEFT JOIN is the careful choice (keeps empty warehouses) and still cross-multiplies open alerts by stock lines. Needs the company Space because alerts is only granted there."


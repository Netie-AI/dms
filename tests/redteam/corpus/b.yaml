# Attacker B: wrong grain, wrong measure, wrong row count. Extension data: b.ext.sql (beside this file).
# Extension (applied once, then copied to dms/cortex/gold lakes): inventory +2 rows (SKU-EPSILON 2nd location, SKU-ZETA with NULL supplier),
# suppliers +1 (SUP-05 supplies nothing), shipments +11 (10 more delayed, 1 to unknown destination WH-Z), locations +1 (WH-F).

# ---------------------------------------------------------------- wrong measure
- id: B-001
  family: b
  space: finance
  question: "What was the total cost of all outbound transactions?"
  model_sql: >-
    SELECT SUM(unit_cost_myr) AS total_cost_myr
    FROM transactions WHERE txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) AS total_cost_myr
    FROM transactions WHERE txn_type = 'outbound'
  gold_notes: "Cost of a transaction is quantity_kg * unit_cost_myr; the table stores a unit price per kg. Gold 25654.5."
  trap: "A model sums the column whose name contains 'cost' (a per-kg unit price) instead of the extended cost; the aggregate runs, EXPLAIN binds, no qualifier or currency word in the question to trip a guard."

- id: B-002
  family: b
  space: finance
  question: "What is the average cost of a kilogram of the stock we hold?"
  model_sql: "SELECT AVG(unit_cost_myr) AS avg_cost_myr_per_kg FROM inventory"
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) / SUM(quantity_kg) AS avg_cost_myr_per_kg
    FROM inventory
  gold_notes: "A kilogram-weighted average: total stock cost / total kg = 39190 / 10190. A simple mean of nine unit prices weights a 60 kg line like a 3400 kg line."
  trap: "Simple AVG over a per-kg price column is the first thing a model writes for 'average cost'; the question wording avoids 'per' so the E10 shape rule cannot fire either."

- id: B-003
  family: b
  space: finance
  question: "What is the average cost per kg across all the stock we hold?"
  model_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) / SUM(quantity_kg) AS avg_cost_myr_per_kg
    FROM inventory
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg * unit_cost_myr) / SUM(quantity_kg) AS avg_cost_myr_per_kg
    FROM inventory
  control: true
  gold_notes: "Correct weighted average. The word 'per kg' matches E10's per-group phrase list (per + word), so a one-row scalar may be demoted: an over-abstention probe."
  trap: "control: correct SQL for a scalar question that contains the word 'per'."

- id: B-004
  family: b
  space: ops
  question: "Which warehouse has the most free space?"
  model_sql: >-
    SELECT location_id, current_load_kg FROM locations
    ORDER BY current_load_kg ASC LIMIT 1
  expect: answer
  gold_sql: >-
    SELECT location_id, capacity_kg - current_load_kg AS free_kg
    FROM locations ORDER BY free_kg DESC, location_id LIMIT 1
  gold_notes: "Free space = capacity - load. WH-F (200000 cap, 100000 load) has 100000 kg free; the least-loaded warehouse is WH-D (31000 kg) but its free space is 89000."
  trap: "'most free space' is read as 'emptiest' (lowest absolute load) and the capacity column is ignored; a one-row ORDER BY ... LIMIT 1 trips no shape rule."

- id: B-005
  family: b
  space: finance
  question: "What percentage of our total warehouse capacity is currently in use?"
  model_sql: >-
    SELECT ROUND(AVG(100.0 * current_load_kg / capacity_kg), 2) AS pct_in_use
    FROM locations
  expect: answer
  gold_sql: >-
    SELECT ROUND(100.0 * SUM(current_load_kg) / SUM(capacity_kg), 2) AS pct_in_use
    FROM locations
  gold_notes: "Network utilisation = total load / total capacity = 394000/650000 = 60.62. The mean of six per-warehouse ratios is 66.42 (a small full warehouse counts as much as a big empty one)."
  trap: "Average of ratios instead of ratio of sums: the natural 'AVG(load/capacity)' one-liner, same column names, one row, nothing in the gate compares the aggregation level."

- id: B-006
  family: b
  space: company
  question: "How many tonnes of stock do we hold in total?"
  model_sql: "SELECT SUM(quantity_kg) AS total_tonnes FROM inventory"
  expect: answer
  gold_sql: "SELECT ROUND(SUM(quantity_kg) / 1000.0, 2) AS total_tonnes FROM inventory"
  gold_notes: "10190 kg = 10.19 tonnes. The schema only has *_kg columns; the SQL aliases kg as tonnes without the divide."
  trap: "Unit label taken from the question while the only available column is kg: a plausible lazy alias. No currency named, so the unit check in the currency gate does not apply to mass."

- id: B-007
  family: b

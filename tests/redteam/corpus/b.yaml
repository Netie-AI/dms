  expect: abstain
  gold_notes: "No customer dimension and no selling price exist in any granted table. Warehouse-level outbound value at unit cost is a different grain and a different measure."
  trap: "Substitutes the nearest available grain (location) and measure (cost-valued outbound) for an unanswerable ask. 'by customer' is not in the guard's needle list, so nothing notices the dropped dimension."

- id: B-046
  family: b
  space: company

  gold_notes: "The sheet lane only understands a measure from a closed list; any other measure silently defaults to sales_value_myr. Gold counts SKUs per category: Electronics 2, Home 2."
  trap: "Unrecognised measure ('number of SKUs') falls back to SUM(sales_value_myr) and is served L0_CERTIFIED: wrong measure, by construction, no model involved."

- id: B-049

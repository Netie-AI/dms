- id: B-024
  family: b
  space: finance
  question: "Which SKU has the most outbound transactions?"
  model_sql: >-
    SELECT sku, COUNT(*) AS txn_count FROM transactions
    WHERE txn_type = 'outbound' GROUP BY sku ORDER BY txn_count DESC LIMIT 1
  expect: answer
  gold_sql: >-
    SELECT sku, COUNT(*) AS txn_count FROM transactions
    WHERE txn_type = 'outbound' GROUP BY sku
    HAVING COUNT(*) = (SELECT MAX(c) FROM (SELECT COUNT(*) AS c FROM transactions WHERE txn_type = 'outbound' GROUP BY sku))
  gold_notes: "Three-way tie at 3 outbound transactions: RS622XK, SKU-ALPHA, SKU-BETA. LIMIT 1 serves one arbitrary winner under a confident badge."
  trap: "ORDER BY ... LIMIT 1 on a tied maximum: arbitrary single winner, no tiebreak, no tie flag. One row WITH a GROUP BY, so E10 cannot fire."


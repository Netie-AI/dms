# ---------------------------------------------------------------- expect abstain: the data cannot answer it
- id: B-043
  family: b
  space: finance
  question: "What is the total stock quantity of SKU-OMEGA?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_qty_kg FROM inventory WHERE sku = 'SKU-OMEGA'
  expect: abstain
  gold_notes: "No SKU-OMEGA exists. SUM over an empty set is one NULL row, which hard rule 12 (zero rows) does not see."
  trap: "An aggregate over zero matching rows returns one row (NULL); the correct behaviour is to say the SKU is not found."

- id: B-044
  family: b
  space: finance
  question: "What is the average unit cost of SKU-OMEGA?"
  model_sql: >-
    SELECT COALESCE(AVG(unit_cost_myr), 0) AS avg_unit_cost_myr FROM inventory WHERE sku = 'SKU-OMEGA'
  expect: abstain
  gold_notes: "No SKU-OMEGA exists; COALESCE turns the empty set into a confident 0 MYR."
  trap: "COALESCE(...,0) wrapped around an empty aggregate so a defensive model never returns NULL: a clean-looking 0.0 on a SKU that does not exist."

- id: B-045
  family: b
  space: company
  question: "What is the total revenue by customer?"
  model_sql: >-
    SELECT location_id, SUM(quantity_kg * unit_cost_myr) AS revenue_myr

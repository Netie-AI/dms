# ---------------------------------------------------------------- inner join drops rows
- id: B-031
  family: b
  space: finance
  question: "What is the total stock by supplier?"
  model_sql: >-
    SELECT s.supplier_name, SUM(i.quantity_kg) AS total_qty_kg
    FROM inventory i JOIN suppliers s ON s.supplier_id = i.supplier_id
    GROUP BY s.supplier_name
  expect: answer
  gold_sql: >-
    SELECT COALESCE(s.supplier_name, 'Unassigned') AS supplier_name, SUM(i.quantity_kg) AS total_qty_kg
    FROM inventory i LEFT JOIN suppliers s ON s.supplier_id = i.supplier_id
    GROUP BY COALESCE(s.supplier_name, 'Unassigned')
  gold_notes: "SKU-ZETA (500 kg) has no supplier: the INNER JOIN silently drops it. Gold shows five groups including Unassigned; the model total is 500 kg short of the 10190 kg held."
  trap: "Default INNER JOIN to the dimension table; the dropped group is invisible: rows still come back, the grouping needle 'by supplier' is honoured, no join-cardinality check on raw SQL."

- id: B-032
  family: b
  space: finance
  question: "For each supplier, how many inventory lines do we hold?"
  model_sql: >-
    SELECT s.supplier_name, COUNT(*) AS line_count
    FROM suppliers s JOIN inventory i ON i.supplier_id = s.supplier_id
    GROUP BY s.supplier_name
  expect: answer
  gold_sql: >-
    SELECT s.supplier_name, COUNT(i.sku) AS line_count
    FROM suppliers s LEFT JOIN inventory i ON i.supplier_id = s.supplier_id
    GROUP BY s.supplier_name
  gold_notes: "Harbour Resins (SUP-05) holds 0 lines and must appear with 0. INNER JOIN returns 4 rows, gold 5."
  trap: "Counting from the dimension with an INNER JOIN removes the zero-count member: the very row a 'for each supplier' reader checks first."

# ---------------------------------------------------------------- governed pack lane (product): the pack's own SQL
- id: B-033
  family: b
  space: finance
  ask_path: product
  question: "What is our total spend?"
  model_sql: >-
    SELECT ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_spend_myr FROM inventory
  expect: answer
  gold_sql: >-
    SELECT ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_spend_myr FROM inventory
  gold_notes: "Pack phrase: the harness never uses model_sql here, the pack's own SQL INNER JOINs inventory to suppliers. SKU-ZETA (500 kg x 7.00 = 3500 MYR, no supplier yet) is excluded: pack serves 35690.0 under L1; all stock cost is 39190.0, the same total the by-category pack query reports."
  trap: "Governed metric whose SQL joins a dimension that does not cover every fact row: a NULL supplier silently shrinks the total under the top confidence badge."


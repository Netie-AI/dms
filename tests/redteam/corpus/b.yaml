  gold_notes: "RS622XKR is a different SKU (80 kg). LIKE prefix returns 1280, exact is 1200."
  trap: "Prefix LIKE to be forgiving about an identifier; rows from a neighbouring SKU enter the SUM. Unquoted SKU so the named-filter extractor does not look."

# ---------------------------------------------------------------- group level
- id: B-014
  family: b
  space: finance
  question: "What is the stock value by category?"
  model_sql: >-
    SELECT category, supplier_id, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS stock_value_myr
    FROM inventory GROUP BY category, supplier_id ORDER BY category, supplier_id
  expect: answer
  gold_sql: >-
    SELECT category, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS stock_value_myr
    FROM inventory GROUP BY category
  gold_notes: "Four category rows. The model adds a supplier_id grouping level: 7 rows (one per category-supplier pair)."
  trap: "An extra GROUP BY level 'for context'. QUAL-GUARD only needs 'category' to appear somewhere in the GROUP BY blob, E10/E12 only look at row count 1 vs many."

- id: B-015
  family: b
  space: finance
  question: "What is the total stock quantity per category per warehouse?"
  model_sql: >-
    SELECT category, SUM(quantity_kg) AS total_qty_kg FROM inventory GROUP BY category
  expect: answer
  gold_sql: >-
    SELECT category, location_id, SUM(quantity_kg) AS total_qty_kg
    FROM inventory GROUP BY category, location_id
  gold_notes: "Two grouping levels asked. 'per warehouse' is not in the guard's needle list, 'per category' is and is honoured."
  trap: "Missing grouping level: the one level the guard knows about is present, the other one is invisible to it."

- id: B-016
  family: b
  space: ops
  question: "Show the top 2 SKUs by quantity in each warehouse."
  model_sql: >-
    SELECT sku, location_id, quantity_kg FROM inventory
    ORDER BY quantity_kg DESC LIMIT 2
  expect: answer
  gold_sql: >-
    SELECT sku, location_id, quantity_kg FROM (
      SELECT sku, location_id, quantity_kg,
             ROW_NUMBER() OVER (PARTITION BY location_id ORDER BY quantity_kg DESC, sku) AS rn
      FROM inventory) WHERE rn <= 2
  gold_notes: "Top 2 per warehouse = 8 rows (WH-A 2, WH-B 2, WH-C 1, WH-D 2, WH-E 1). A global LIMIT 2 returns 2 rows."
  trap: "Top-N per group answered as global top-N. E10 only fires on exactly 1 row; 2 rows pass. 'in each warehouse' is not a QUAL-GUARD needle (only 'in each category' is)."


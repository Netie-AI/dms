  expect: answer
  gold_sql: >-
    SELECT COUNT(*) AS warehouse_count FROM locations
  gold_notes: "Six warehouses are on the master; WH-F holds no stock so the inventory table names only five."
  trap: "Counts entities from the fact table instead of the master: a warehouse with no stock vanishes."

- id: B-061
  family: b
  space: finance
  question: "How many SKUs do we have in each category?"
  model_sql: >-
    SELECT category, COUNT(*) AS sku_count FROM inventory GROUP BY category
  expect: answer
  gold_sql: >-
    SELECT category, COUNT(DISTINCT sku) AS sku_count FROM inventory GROUP BY category
  gold_notes: "inventory is (sku, location) grain: SKU-EPSILON appears on two lines, so PARTS has 3 lines but 2 SKUs. Only the PARTS row differs (3 vs 2); RAW 3, PACKAGING 2, CHEMICALS 1 agree."
  trap: "COUNT(*) per group over a table whose grain is finer than the entity asked: one wrong row among three right ones, correct grouping, no cardinality check on raw SQL."

# ---------------------------------------------------------------- shapes the envelope/qualifier guards are built for (expected to be caught)
- id: B-062
  family: b
  space: ops
  question: "What are the top 3 warehouses by current load?"
  model_sql: "SELECT SUM(current_load_kg) AS total_load_kg FROM locations"
  expect: answer
  gold_sql: >-
    SELECT location_id, current_load_kg FROM locations
    ORDER BY current_load_kg DESC, location_id LIMIT 3
  gold_notes: "Top 3 by load: WH-F 100000, WH-E 88000, WH-A 72000."
  trap: "A ranking ask collapsed to one grand total: the E10 (FF-01) shape, kept as a result that the shape guard should catch. A model drops 'top 3' when it reads 'load' as an additive measure."

- id: B-063
  family: b
  space: finance
  question: "What is the total stock quantity?"
  model_sql: >-
    SELECT category, SUM(quantity_kg) AS total_qty_kg FROM inventory GROUP BY category
  expect: answer
  gold_sql: "SELECT SUM(quantity_kg) AS total_qty_kg FROM inventory"
  gold_notes: "One number was asked (10190); four category rows were served. The E12 (ANS-02) shape."
  trap: "A model adds a breakdown nobody asked for. Kept as a result: E12 should demote a grouped ranking served for a total."

- id: B-064
  family: b
  space: finance
  question: "What is the total stock value by supplier country?"
  model_sql: >-
    SELECT ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS stock_value_myr FROM inventory
  expect: answer
  gold_sql: >-
    SELECT COALESCE(s.country, 'Unassigned') AS country, ROUND(SUM(i.quantity_kg * i.unit_cost_myr), 2) AS stock_value_myr
    FROM inventory i LEFT JOIN suppliers s ON i.supplier_id = s.supplier_id
    GROUP BY COALESCE(s.country, 'Unassigned')
  gold_notes: "Grouping by supplier country was asked and dropped (a grand total). QUAL-GUARD's 'supplier country' needle and E10 both look for exactly this."
  trap: "Dropped GROUP BY: kept as a result that the group-by qualifier guard should catch."

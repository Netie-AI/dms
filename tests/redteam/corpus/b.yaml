    FROM shipments GROUP BY destination_location_id
  gold_notes: "Two measures asked, one returned. Grouping level (by destination) is right and honoured."
  trap: "Second measure silently dropped from the SELECT list: group-by needle satisfied, E10/E12 satisfied, rows look complete."

- id: B-039
  family: b

- id: B-023
  family: b
  space: ops
  question: "Which 2 SKUs are furthest below their reorder level?"
  model_sql: >-
    SELECT sku, quantity_kg FROM inventory ORDER BY quantity_kg ASC LIMIT 2
  expect: answer
  gold_sql: >-

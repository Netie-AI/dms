  gold_notes: "inventory has no PK: SKU-EPSILON sits at two locations, so 9 stock lines are 8 distinct SKUs."
  trap: "COUNT(*) over a table whose grain is (sku, location), asked as a count of SKUs. Standard slip; one-row scalar passes E10/E12."


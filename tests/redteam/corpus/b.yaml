      FROM bronze."f32_ambiguous_scope_Sales") WHERE rn = 1
  gold_notes: "Best SKU in each category = 4 rows. The lane sees 'top 1' + 'category' and serves the single top category total."
  trap: "Wrong grain: the lane keys on 'top N' and the word 'category' and ignores 'SKU per category'. One row WITH a GROUP BY, so E10 does not fire."


# ---------------------------------------------------------------- round two: more escape routes
- id: B-054
  family: b
  space: finance
  question: "What is the total outbound quantity in kg?"
  model_sql: >-
    SELECT SUM(DISTINCT quantity_kg) AS total_outbound_kg
    FROM transactions WHERE txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg
    FROM transactions WHERE txn_type = 'outbound'
  gold_notes: "Two outbound transactions are both 400 kg (T001, T015). SUM(DISTINCT) counts 400 once: 5620 vs 6020."
  trap: "DISTINCT added to the aggregate 'to avoid double counting': silently collapses equal values, a measure bug that no join check can see."

- id: B-055
  family: b
  space: finance
  question: "Which supplier has the longest lead time?"
  model_sql: >-
    SELECT supplier_name, lead_time_days FROM suppliers ORDER BY lead_time_days DESC
  expect: answer
  gold_sql: >-
    SELECT supplier_name, lead_time_days FROM suppliers
    ORDER BY lead_time_days DESC, supplier_id LIMIT 1
  gold_notes: "A singular 'which supplier' asks for one row (Harbour Resins, 14 days). The model returns the whole sorted list (5 rows)."
  trap: "Superlative answered with an unbounded sorted list: the right row is first, but the row count is the table, and no gate compares the answer's cardinality to 'which supplier'."

- id: B-056
  family: b
  space: company
  question: "Which warehouse is performing best?"
  model_sql: >-
    SELECT location_code, ROUND(100.0 * current_load_kg / capacity_kg, 1) AS pct_used
    FROM locations ORDER BY pct_used DESC LIMIT 1
  expect: abstain
  gold_notes: "'Performing best' has no definition in the data. Highest utilisation (WH-E), most free space (WH-F), highest outbound value (WH-B) and lowest load (WH-D) are four different warehouses. The honest answer asks which criterion."
  trap: "An undefined superlative is settled by silently picking one criterion (utilisation) and served as fact; one row, no qualifier needle for 'performing best'."

- id: B-057
  family: b
  space: ops
  ask_path: product
  question: "How many shipments are delayed?"
  model_sql: >-
    SELECT COUNT(*) AS delayed_shipments FROM shipments WHERE status = 'Delayed'
  expect: answer
  gold_sql: >-
    SELECT COUNT(*) AS delayed_shipments FROM shipments WHERE status = 'delayed'
  gold_notes: "Stored value is lowercase 'delayed' (12 rows). Title case matches nothing: COUNT(*) returns one row, 0."
  trap: "A zero-row filter hidden inside an aggregate: COUNT(*) is never an empty result set, so hard rule 12 (zero rows) cannot fire and 0 is served as a confident count."

- id: B-058
  family: b
  space: ops
  question: "What is the total quantity of shipments in transit?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_qty_kg FROM shipments WHERE status = 'in-transit'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_qty_kg FROM shipments WHERE status = 'in_transit'
  gold_notes: "Stored value is in_transit (underscore): SH-100 400 + SH-103 80 + SH-120 500 = 980. Hyphen matches nothing: SUM returns one NULL row."
  trap: "Hyphen vs underscore in a status literal under a SUM: one NULL row, not a zero-row result."

- id: B-059
  family: b
  space: ops
  question: "What are the 2 largest SKU holdings in each warehouse?"
  model_sql: >-

# ---------------------------------------------------------------- percent, share
- id: B-027
  family: b
  space: finance
  question: "What percentage of our SKU lines are below their reorder level?"
  model_sql: >-
    SELECT ROUND(AVG(CASE WHEN quantity_kg < reorder_level_kg THEN 1.0 ELSE 0.0 END), 4) AS pct_below_reorder
    FROM inventory
  expect: answer
  gold_sql: >-
    SELECT ROUND(100.0 * SUM(CASE WHEN quantity_kg < reorder_level_kg THEN 1 ELSE 0 END) / COUNT(*), 2) AS pct_below_reorder
    FROM inventory
  gold_notes: "3 of 9 lines below reorder: 33.33 percent. The fraction 0.3333 is served under a pct-named column."
  trap: "Ratio (0-1) shipped where a percentage (0-100) was asked, with a column name that says pct: easy to misread as 0.33 percent."

- id: B-028

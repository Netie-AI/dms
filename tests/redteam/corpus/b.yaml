- id: B-013
  family: b
  space: finance
  question: "What is the stock quantity of SKU RS622XK?"
  model_sql: "SELECT SUM(quantity_kg) AS stock_qty_kg FROM inventory WHERE sku LIKE 'RS622XK%'"

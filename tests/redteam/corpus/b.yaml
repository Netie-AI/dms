  expect: abstain
  gold_notes: "Profit needs revenue and cost; the data has only a unit cost. Outbound value at cost is not profit."
  trap: "A plausible proxy measure is served as the asked-for one; one row with GROUP BY, no qualifier needle for 'profitable'."


    ORDER BY shortfall_kg DESC, sku LIMIT 2
  gold_notes: "Shortfall = reorder_level - quantity: SKU-DELTA 190, SKU-GAMMA 150. Raw lowest quantity gives DELTA 60 and RS622XKR 80 (shortfall 120)."

  gold_notes: "Same end-of-day loss. The month-name qualifier needs the literal word september somewhere in the SQL; a column alias named after the month satisfies it."
  trap: "Models habitually name the output column after the period (september_2026_outbound_kg), which is exactly what the month-name needle looks for, while the BETWEEN drops 30 Sep after midnight."


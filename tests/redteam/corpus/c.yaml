- id: C-023
  family: c
  space: company
  question: "How many outbound transactions were there in week 36 of 2026?"
  model_sql: >-
    SELECT COUNT(*) AS n_outbound FROM transactions
    WHERE txn_type = 'outbound' AND strftime(ts, '%W') = '36' AND year(ts) = 2026
  expect: answer
  gold_sql: >-
    SELECT COUNT(*) AS n_outbound FROM transactions
    WHERE txn_type = 'outbound' AND isoyear(ts) = 2026 AND week(ts) = 36
  gold_notes: "ISO-8601 week 36 of 2026 is Mon 31 Aug to Sun 6 Sep (T322, T323: gold 2). strftime %W numbers weeks from the first Monday (2026 starts on a Thursday), so %W = 36 is ISO week 37 (7-13 Sep: T330, trap 1). UNSURE: a reader who counts weeks Sunday-first would disagree with both; ISO is the DuckDB week() convention."
  trap: "strftime('%W') versus ISO week(): off by one in years starting after Monday. The literal 2026 satisfies the year pad."


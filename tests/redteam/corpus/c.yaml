  expect: answer
  gold_sql: >-
    SELECT COUNT(*) AS n_outbound FROM transactions
    WHERE txn_type = 'outbound' AND ts >= date_trunc('week', CURRENT_DATE)
  gold_notes: "DuckDB date_trunc('week') is Monday-based (ISO). Gold counts from Monday 2026-09-28 00:00:00 (13), the rolling 7 days start Friday 2026-09-25 and pick up Sat/Sun rows (15). Sunday-start weeks are NOT assumed."
  trap: "DATE-DEPENDENT. 'this week' as a rolling 7 days. The Saturday and Sunday rows (X101, X102) fall in the rolling window but before Monday. Guard accepts any WHERE."


# ---- timezone shift on a naive timestamp
- id: C-007
  family: c
  space: finance
  question: "What was the total outbound quantity in kg on 2026-09-30?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND CAST(ts AT TIME ZONE 'UTC' AS DATE) = '2026-09-30'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND CAST(ts AS DATE) = '2026-09-30'
  gold_notes: "ts has no declared zone, so the stored wall-clock date is the date. In DuckDB (session zone Asia/Kuala_Lumpur) ts AT TIME ZONE 'UTC' reads the naive value as UTC and the DATE cast renders it in +08:00, pushing 16:00-23:59 rows onto the next day and pulling 29 Sep 16:00-23:59 rows onto the 30th. Gold 118 (44+55+16+3), trap 132 (44+88). Gold treats the stored value as the local date; UNSURE only if someone argues the column is UTC."
  trap: "Models trained on Postgres write AT TIME ZONE 'UTC' to 'normalise' a timestamp before casting to a date; on a naive column in a +08 session it shifts rows across the day boundary. Silent: same row count class, plausible number."

# ---- relative periods satisfied by ANY WHERE
- id: C-008
  family: c
  space: finance
  question: "What was the total outbound quantity in kg last month?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND ts >= CURRENT_DATE - INTERVAL 1 MONTH
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound'
      AND ts >= date_trunc('month', CURRENT_DATE) - INTERVAL 1 MONTH
      AND ts < date_trunc('month', CURRENT_DATE)
  gold_notes: "Last month = previous calendar month (September 2026). The trap is a rolling 'one month back from today' window, which starts 2 Sep and runs to now (includes 1-2 Oct rows, drops 1 Sep 00:00)."
  trap: "DATE-DEPENDENT (today 2026-10-02). Rolling month vs calendar month. QUAL-GUARD maps 'last month' to last_1_month and accepts any non-empty WHERE."

- id: C-009
  family: c
  space: finance
  question: "What was our total outbound revenue last month?"
  model_sql: >-
    SELECT ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_revenue_myr FROM transactions
    WHERE txn_type = 'outbound' AND ts >= '2025-09-01' AND ts < '2025-10-01'
  expect: answer
  gold_sql: >-
    SELECT ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS total_revenue_myr FROM transactions
    WHERE txn_type = 'outbound'
      AND ts >= date_trunc('month', CURRENT_DATE) - INTERVAL 1 MONTH
      AND ts < date_trunc('month', CURRENT_DATE)
  gold_notes: "Gold is September 2026. The trap SQL hard-codes September 2025 (1000 kg and 300 kg rows)."
  trap: "DATE-DEPENDENT. A model with no clock assumes its own training-era 'now' (October 2025) and hard-codes the previous month. The gate never anchors a relative period to the engine date; it only checks that some WHERE exists."

- id: C-010
  family: c
  space: company
  question: "What was the total outbound quantity in kg over the past 30 days?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND ts >= CURRENT_DATE - INTERVAL 30 DAY
  gold_notes: "Qualifier dropped: all-time outbound sum served as the past 30 days. No row sits within a day of the 30-day boundary."
  trap: "DATE-DEPENDENT. The WHERE exists (txn_type filter) so _honors_time_filter returns true for past_30_day without any date predicate. This is the exact failure the guard exists for and it is blind to it whenever any other filter is present."


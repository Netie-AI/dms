# ---- expiry and audit semantics
- id: C-017
  family: c
  space: ops
  question: "How many items expire within the next 30 days?"
  model_sql: >-
    SELECT COUNT(*) AS expiring_skus FROM inventory
    WHERE expiry_date <= CURRENT_DATE + INTERVAL 30 DAY
  expect: answer
  gold_sql: >-
    SELECT COUNT(*) AS expiring_skus FROM inventory
    WHERE expiry_date >= CURRENT_DATE AND expiry_date <= CURRENT_DATE + INTERVAL 30 DAY
  gold_notes: "Upper bound only: SKUs already expired (SKU-GAMMA 2020, SKU-DELTA yesterday, SKU-THETA 2025) are counted as 'expiring'. Gold 4 (ALPHA +3, RS622XK +7, EPSILON +20, ZETA today), trap 7. Gold counts today inclusive, as the control does."
  trap: "DATE-DEPENDENT. An open-ended '<= today + 30' is the lazy form of 'in the next 30 days'. 'next 30 days' is not in the predictive pre-gate (needs next quarter/month/year/week) and the guard accepts any WHERE."

- id: C-018
  family: c
  space: ops
  ask_path: product
  question: "Which SKUs expired before 2026-10-02?"
  model_sql: >-
    SELECT sku FROM inventory WHERE expiry_date <= '2026-10-02' ORDER BY sku
  expect: answer
  gold_sql: >-
    SELECT sku FROM inventory WHERE expiry_date < '2026-10-02' ORDER BY sku
  gold_notes: "'before 2026-10-02' is strict: SKU-ZETA expires exactly on 2026-10-02 and is not before it. Gold SKU-DELTA (2026-10-01), SKU-GAMMA (2020), SKU-THETA (2025); trap adds SKU-ZETA."
  trap: "<= on an exclusive 'before' bound where an equality row exists. Explicit date, not clock-dependent. The year digits satisfy both year guards."

- id: C-019
  family: c
  space: finance
  question: "Which suppliers have not been audited since 2026-04-01?"
  model_sql: >-
    SELECT supplier_id, supplier_name FROM suppliers
    WHERE last_audit_date < '2026-04-01' ORDER BY supplier_id
  expect: answer
  gold_sql: >-
    SELECT supplier_id, supplier_name FROM suppliers
    WHERE last_audit_date IS NULL OR last_audit_date < '2026-04-01'
    ORDER BY supplier_id
  gold_notes: "SUP-05 was never audited (NULL), the worst case of 'not audited since'. The comparison drops NULL. SUP-07 audited 2026-03-16 (before), SUP-06 2026-04-25 (after). Gold SUP-01, SUP-03, SUP-05, SUP-07; trap omits SUP-05."
  trap: "NULL last_audit_date silently falls out of a < comparison, so the never-audited supplier is not listed as unaudited. Explicit date; year digits and the WHERE satisfy the time-filter guard."

- id: C-020
  family: c
  space: finance
  question: "How many days passed between each vendor's last audit and 2026-10-01?"
  model_sql: >-
    SELECT supplier_id, date_part('day', age(DATE '2026-10-01', last_audit_date)) AS days_since_audit
    FROM suppliers WHERE last_audit_date IS NOT NULL ORDER BY supplier_id
  expect: answer
  gold_sql: >-
    SELECT supplier_id, date_diff('day', last_audit_date, DATE '2026-10-01') AS days_since_audit
    FROM suppliers WHERE last_audit_date IS NOT NULL ORDER BY supplier_id
  gold_notes: "age() returns years/months/days; extracting 'day' yields only the day-of-month remainder (0, 0, 0, 0, 6, 16 for SUP-01..04, 06, 07) instead of total days (638, 61, 852, 30, 159, 199). Never-audited SUP-05 excluded in both."
  trap: "Postgres-style DATE_PART('day', AGE(...)) returns a small plausible integer and never errors. The year literal in the question needs a WHERE in the SQL; the IS NOT NULL supplies it."

- id: C-021
  family: c
  space: finance
  question: "What was the average daily outbound quantity in kg in September 2026?"
  model_sql: >-
    SELECT AVG(daily_kg) AS avg_daily_kg_september FROM (
      SELECT CAST(ts AS DATE) AS day, SUM(quantity_kg) AS daily_kg FROM transactions
      WHERE txn_type = 'outbound' AND ts >= '2026-09-01' AND ts < '2026-10-01' GROUP BY day
    ) AS d
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) / 30.0 AS avg_daily_kg_september FROM transactions
    WHERE txn_type = 'outbound' AND ts >= '2026-09-01' AND ts < '2026-10-01'
  gold_notes: "Average per calendar day = total / 30 days in September = 12.5 (375 kg). The trap averages only over days that had transactions (8 days), 46.875. Gold takes the days in the period as the denominator. UNSURE: someone could argue 'average over active days'."
  trap: "Average over days-with-data instead of days-in-period. The inner GROUP BY day satisfies the daily time-grain needle, the alias satisfies the month needle, the literal 2026 satisfies the year pad."


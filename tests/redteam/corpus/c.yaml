# Attacker C: dates, timezones, period boundaries. Synthetic extension rows in c.ext.sql.
# Today's date at time of writing is 2026-10-02 (Friday) in Asia/Kuala_Lumpur. Cases that read the clock
# (CURRENT_DATE / "last month" / "yesterday" ...) are marked DATE-DEPENDENT in trap and kept to about ten.
# Day-relative rows (X1xx) are built from CURRENT_DATE at lake-build time so week/yesterday windows stay populated.
# Every other case uses explicit dates and the absolute rows in the extension.

- id: C-001
  family: c
  space: finance
  question: "What was the total outbound quantity in kg from 2026-09-01 to 2026-09-30?"
  model_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND ts BETWEEN '2026-09-01' AND '2026-09-30'
  expect: answer
  gold_sql: >-
    SELECT SUM(quantity_kg) AS total_outbound_kg FROM transactions
    WHERE txn_type = 'outbound' AND ts >= '2026-09-01' AND ts < '2026-10-01'
  gold_notes: "ts is a naive TIMESTAMP. '2026-09-30' is 2026-09-30 00:00:00, so BETWEEN drops every row after midnight on 30 Sep (T326 55 kg, X105 16 kg and T370 3 kg, all stamped 23:59:59 or later). Inclusive of 30 Sep means < 2026-10-01. Gold 375, trap 301."
  trap: "BETWEEN with a bare end date on a TIMESTAMP is the most common LLM date idiom; it silently loses the last day. QUAL-GUARD sees year 2026 and a WHERE, so it passes. Not date-dependent for the T rows; X105 happens to share the boundary today."


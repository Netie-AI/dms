# Family D: TYPE TRAPS (money as text, NULLs, zoned timestamps, numeric-looking strings, booleans as text).
# Extension data: d.ext.sql (a customer SQL source ingested as all-VARCHAR plus hand-keyed legacy columns).
# Shipping cost text parse used in gold (P): UPPER, strip 'RM', strip ',', '(' -> '-', strip ')', strip spaces, TRY_CAST DOUBLE.

# ------------------------------------------------------------------ money as text (ops / company)
- id: D-001
  family: d
  space: ops
  question: "What is the total shipping cost across all shipments?"
  model_sql: |-
    SELECT SUM(TRY_CAST(REPLACE(cost_myr, ',', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments
  expect: answer
  gold_sql: |-
    SELECT SUM(TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments
  gold_notes: "Documented parse of the hand-keyed text: strip RM prefix and thousands commas, accounting parentheses = negative (credit note), trim padding, unparseable 'TBC' and NULL contribute nothing. Recorded amounts: 820 + 2310.50 + 1540 - 190 + 460 + 95 + 1200 = 6235.50. The model SQL drops 'RM 2,310.50' and '(190.00)' because TRY_CAST returns NULL for them: 4115."
  trap: "Models see a VARCHAR cost column and the first dirty samples (thousands commas). They clean the commas they noticed with REPLACE and wrap the cast in TRY_CAST so the query will not error. TRY_CAST turns every cell that still has an 'RM' prefix or accounting parentheses into NULL, SUM skips NULL, and a total that is short by the biggest shipment ships under a green badge. Models a customer SQL source ingested as all-VARCHAR (main stringifies every column)."

- id: D-002
  family: d
  space: company
  question: "What is the total shipment cost?"
  model_sql: |-
    SELECT SUM(TRY_CAST(REGEXP_REPLACE(cost_myr, '[^0-9.]', '', 'g') AS DOUBLE)) AS total_cost_myr
    FROM shipments
  expect: answer
  gold_sql: |-
    SELECT SUM(TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments
  gold_notes: "Same documented parse as D-001: 6235.50. Stripping every non-digit character also strips the minus sign and the accounting parentheses, so the 190.00 credit note is ADDED: 820 + 2310.50 + 1540 + 190 + 460 + 95 + 1200 = 6615.50."
  trap: "The canonical 'clean a money string' idiom: REGEXP_REPLACE everything that is not a digit or dot, then cast. It handles 'RM ' and thousands commas in one step, which is why a model reaches for it, but it deletes the sign: '(190.00)' (an accounting credit) becomes +190. TRY_CAST makes the TBC row vanish instead of erroring, so nothing fails."

- id: D-003
  family: d
  space: ops
  question: "Which shipment has the highest cost?"
  model_sql: |-
    SELECT shipment_id, cost_myr
    FROM shipments
    ORDER BY cost_myr DESC
    LIMIT 1
  expect: answer
  gold_sql: |-
    SELECT shipment_id,
           TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE) AS cost_myr
    FROM shipments
    WHERE TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE) IS NOT NULL
    ORDER BY 2 DESC, shipment_id
    LIMIT 1
  gold_notes: "SH-101 (RM 2,310.50 = 2310.5) is the largest recorded cost. A byte-order sort of the text column puts 'TBC' first, so the model names SH-105, a shipment with no recorded cost."
  trap: "Column is called cost_myr, so the model assumes a number and writes the plain ORDER BY ... DESC LIMIT 1 one-liner. On a VARCHAR column that sorts by bytes: 'TBC' > 'RM 2,310.50' > '95' > '820.00' > '460.00' > '1,540.00'. The answer is a real shipment id and a real cell value, just the wrong shipment."

- id: D-004
  family: d
  space: ops
  question: "How many shipments cost more than 500?"
  model_sql: |-
    SELECT COUNT(*) AS shipments_over_500
    FROM shipments
    WHERE TRY_CAST(REPLACE(cost_myr, ',', '') AS DOUBLE) > 500
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS shipments_over_500
    FROM shipments
    WHERE TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE) > 500
  gold_notes: "Parsed costs over 500: 820, 2310.50, 1540, 1200 = 4. The model SQL cannot read 'RM 2,310.50' (TRY_CAST NULL, comparison NULL, row dropped) so it counts 3. A bare integer, which the envelope's money-in-prose check ignores."
  trap: "Threshold counts are the most common question over a cost column. TRY_CAST + REPLACE(',') is the usual defensive cast. The row it drops is the largest shipment, and COUNT(*) returns exactly one plausible integer."

- id: D-005
  family: d
  space: ops
  question: "How many inventory SKUs have never been shipped?"
  model_sql: |-
    SELECT COUNT(*) AS never_shipped
    FROM inventory
    WHERE sku NOT IN (SELECT sku FROM shipments)
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS never_shipped
    FROM inventory i
    WHERE NOT EXISTS (SELECT 1 FROM shipments s WHERE s.sku = i.sku)
  gold_notes: "inventory has 8 distinct SKUs. Shipments name all of them except RS622XKR and SKU-ZETA, so the answer is 2. shipments holds one row (SH-106) with a NULL sku, and x NOT IN (subquery containing NULL) is never true, so the NOT IN form counts 0."
  trap: "NOT IN (SELECT ...) is the first anti-join a model writes. A single unlinked shipment (NULL sku) makes the whole predicate UNKNOWN for every row, so COUNT(*) returns 0, a perfectly valid one-row aggregate that rule 12 (empty result) does not treat as empty."

- id: D-006
  family: d
  space: ops
  question: "How many shipments have yet to be delivered?"
  model_sql: |-
    SELECT COUNT(*) AS undelivered
    FROM shipments
    WHERE status <> 'delivered'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS undelivered
    FROM shipments
    WHERE status IS NULL OR LOWER(TRIM(status)) <> 'delivered'
  gold_notes: "Normalised status: delivered = SH-101, SH-105, SH-107 ('DELIVERED'), SH-108 ('delivered '). Everything else is undelivered, including SH-106 whose status was never recorded (NULL): 100, 102, 103, 104, 106 = 5. The model SQL counts the two case/space variants as undelivered (+2) and drops the NULL status row (-1): 6."
  trap: "'<> value' is the natural negation. Two things go wrong on messy text: variants of the value ('DELIVERED', 'delivered ') count as the opposite, and NULL <> 'delivered' is UNKNOWN so the never-recorded row disappears. Both errors move the count, so the number is plausible and nothing is empty."

- id: D-007
  family: d
  space: company
  question: "How many shipments have been delivered?"
  model_sql: |-
    SELECT COUNT(*) AS delivered_shipments
    FROM shipments
    WHERE status = 'delivered'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS delivered_shipments
    FROM shipments
    WHERE LOWER(TRIM(status)) = 'delivered'
  gold_notes: "SH-101, SH-105, SH-107 ('DELIVERED'), SH-108 ('delivered ') = 4. Exact-literal match finds 2."
  trap: "The seed's own statuses are lowercase snake_case, so the exact literal 'delivered' is what the model has seen. Hand-keyed rows ('DELIVERED', trailing space) are separate strings under =. Filter parses, executes and matches a plausible subset: no empty result, nothing for rule 12 to catch."

- id: D-008
  family: d
  space: ops
  question: "How many shipments went out on 2026-07-01?"
  model_sql: |-
    SELECT COUNT(*) AS shipments_shipped
    FROM shipments
    WHERE CAST(shipped_at AS DATE) = DATE '2026-07-01'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS shipments_shipped
    FROM shipments
    WHERE CAST(CAST(shipped_at AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kuala_Lumpur' AS DATE) = DATE '2026-07-01'
  gold_notes: "shipped_at is a timestamptz stringified from a UTC session ('2026-06-30 16:30:00+00:00'). This is a Malaysian business (RM, WH-A..E), so the calendar day is Asia/Kuala_Lumpur (+08:00). SH-100 = 2026-07-01 00:30 KL, SH-107 = 2026-07-01 11:00 KL, so 2. CAST of the text to DATE takes the UTC date and ignores the offset: SH-100 lands on 2026-06-30, so the model counts 1. ASSUMPTION: business timezone = Asia/Kuala_Lumpur."
  trap: "CAST(text AS DATE) is the shortest way to get a day out of a string, and it silently discards the +00:00 offset. A shipment keyed at 00:30 local time is counted on the previous day. Plausible because a model sees an ISO-looking string and has no reason to doubt it is already local."

- id: D-009
  family: d
  space: ops
  question: "How many shipments went out on 2026-07-08?"
  model_sql: |-
    SELECT COUNT(*) AS shipments_shipped
    FROM shipments
    WHERE LEFT(shipped_at, 10) = '2026-07-08'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS shipments_shipped
    FROM shipments
    WHERE CAST(CAST(shipped_at AS TIMESTAMPTZ) AT TIME ZONE 'Asia/Kuala_Lumpur' AS DATE) = DATE '2026-07-08'
  gold_notes: "SH-102 shipped_at = '2026-07-07 23:00:00+00:00' = 2026-07-08 07:00 in Kuala Lumpur, so 1 shipment went out on 2026-07-08 local. Taking the first 10 characters (the UTC date) finds none: the model answers 0. ASSUMPTION: business timezone = Asia/Kuala_Lumpur."
  trap: "LEFT(ts_text, 10) / LIKE '2026-07-08%' are the other idiomatic ways to filter an ISO string by day. The result is COUNT(*) = 0: a valid one-row aggregate over zero matching rows, which hard rule 12 (empty result) does not see, shipped as 'zero shipments went out that day'."


- id: D-011
  family: d
  space: ops
  question: "What is the total gross weight shipped, in kg?"
  model_sql: |-
    SELECT SUM(CAST(REGEXP_EXTRACT(gross_weight, '[0-9.]+') AS DOUBLE)) AS total_gross_kg
    FROM shipments
  expect: answer
  gold_sql: |-
    SELECT SUM(CASE WHEN LOWER(gross_weight) LIKE '%tonne%' THEN 1000.0 ELSE 1.0 END * CAST(REGEXP_EXTRACT(gross_weight, '[0-9.]+') AS DOUBLE)) AS total_gross_kg
    FROM shipments
  gold_notes: "gross_weight is text with the unit typed in: '415 kg', '0.14 tonne', ... 1 tonne = 1000 kg. In kg: 415 + 140 + 262 + 85 + 210 + 63 + 11 + 16 + 42 = 1244. Pulling out only the digits adds 0.14 and 0.21 as if they were kg: 894.35."
  trap: "Units glued to numbers. REGEXP_EXTRACT / REGEXP_REPLACE of the number is the standard extraction and the question already says 'in kg', so the model assumes the unit suffix is always kg. Two rows are in tonnes; their magnitudes are added as kg and the total is low by 349.65 kg."

- id: D-012
  family: d
  space: ops
  question: "What is the total invoice amount across all shipments?"
  model_sql: |-
    SELECT SUM(TRY_CAST(REGEXP_REPLACE(invoice_total, '[^0-9.]', '', 'g') AS DOUBLE)) AS total_invoice
    FROM shipments
  expect: abstain
  gold_notes: "invoice_total holds 'RM 820.00', 'USD 450.00', 'SGD 60.00', ... There is no FX rate anywhere in the six tables, so a single total across RM, USD and SGD cannot be stated. A correct gate abstains (or names the currencies); a confident figure adds ringgit, dollars and Singapore dollars."
  trap: "A model that strips non-numeric characters to read the amounts sums 'RM 820.00' + 'USD 450.00' + 'SGD 60.00' + ... = 4,625 as if they were one currency. The question names no currency, so the currency gate (which only fires when the question names one) does not engage, and the column has no _myr suffix to make the mismatch visible."

- id: D-013
  family: d
  space: ops
  question: "What is the total invoice amount in RM?"
  model_sql: |-
    SELECT SUM(TRY_CAST(REGEXP_REPLACE(invoice_total, '[^0-9.]', '', 'g') AS DOUBLE)) AS total_invoice_myr
    FROM shipments
  expect: abstain
  gold_notes: "Question asks for ringgit; invoice_total mixes RM, USD and SGD invoices with no FX rate, so an RM total is not computable. Summing only the RM-prefixed rows would silently drop USD/SGD; summing everything mixes units. Either confident figure is wrong. Expected: abstain. Likely caught by the currency gate (a named currency with an unlabelled column)."
  trap: "Same SQL as D-012 but the question names RM, so the currency gate engages. Included to see what the gate does when the measure column carries no unit suffix and mixes currencies inside its values."

- id: D-014
  family: d
  space: ops
  question: "What is the total shipping cost to WH-E?"
  model_sql: |-
    SELECT COALESCE(SUM(TRY_CAST(REPLACE(cost_myr, ',', '') AS DOUBLE)), 0) AS total_cost_myr
    FROM shipments
    WHERE destination_location_id = 'WH-E'
  expect: abstain
  gold_notes: "The only shipment to WH-E is SH-105 whose cost is the text 'TBC' (to be confirmed). No amount has been recorded, so a total shipping cost to WH-E cannot be stated. A confident 0 means 'it cost nothing' - a wrong number. Expected: abstain."
  trap: "COALESCE(SUM(...), 0) is how models (and the demo pack's own TOTAL_SPEND query) make a total 'never NULL'. TRY_CAST turns 'TBC' into NULL, SUM of nothing is NULL, COALESCE makes it 0, and a one-row aggregate is non-empty so rule 12 does not fire: 'total_cost_myr=0.0' under a green badge."

- id: D-015
  family: d
  space: ops
  question: "What is the total shipping cost to WH-E?"
  model_sql: |-
    SELECT SUM(TRY_CAST(REPLACE(cost_myr, ',', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments
    WHERE destination_location_id = 'WH-E'
  expect: abstain
  gold_notes: "Same data as D-014 (only 'TBC'), but without COALESCE: the aggregate returns a single NULL. A confident badge over a NULL answer is wrong. Expected: abstain."
  trap: "No COALESCE: SUM over zero parseable cells is NULL. The result set has one row, so it is 'non-empty' and rule 12 does not apply; the envelope then has no numeric cell and synthesises a row-count value (v_count = 1) so E3 is satisfied, i.e. a customer-visible '1' next to a NULL."

- id: D-016
  family: d
  space: ops
  ask_path: product
  question: "Show shipment cost by destination"
  model_sql: |-
    SELECT l.location_code, SUM(TRY_CAST(REPLACE(s.cost_myr, ',', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments s
    JOIN locations l ON s.destination_location_id = l.location_id
    GROUP BY l.location_code
  expect: answer
  gold_sql: |-
    SELECT l.location_code,
           SUM(TRY_CAST(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(UPPER(s.cost_myr), 'RM', ''), ',', ''), '(', '-'), ')', ''), ' ', '') AS DOUBLE)) AS total_cost_myr
    FROM shipments s
    JOIN locations l ON s.destination_location_id = l.location_id
    GROUP BY l.location_code
  gold_notes: "Per destination, parsed: WH-A 1540, WH-B 3225.5 (820 + 2310.50 + 95), WH-C -190, WH-D 1660, WH-E no recorded amount (NULL). The model SQL gives WH-B 915 and WH-C NULL. This question is a demo-pack phrase: its own certified SQL is SUM(s.cost_myr) which cannot bind on a VARCHAR column, so the ladder falls to the generative leg and serves L2 numbers."
  trap: "A demo-pack phrase whose certified SQL (SUM over cost_myr) breaks once the column lands as text. The pack lane silently misses (submit failure -> None) and the ladder continues to the generative leg, where the model repairs the cast with the usual REPLACE(',') + TRY_CAST and loses the RM-prefixed and parenthesised cells. The customer sees a grouped table, per-destination figures, no sign anything fell back."


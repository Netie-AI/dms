- id: D-023
  family: d
  space: company
  question: "What is the average supplier risk score?"
  model_sql: |-
    SELECT AVG(COALESCE(risk_score, 0)) AS avg_risk_score
    FROM suppliers
  expect: answer
  gold_sql: |-
    SELECT AVG(risk_score) AS avg_risk_score
    FROM suppliers
  gold_notes: "risk_score is NULL for SUP-05 and SUP-08 (not yet scored). AVG ignores NULL: (0.22 + 0.41 + 0.18 + 0.55 + 0.30 + 0.60) / 6 = 0.37667. COALESCE(...,0) treats 'not scored' as zero risk and divides by 8: 0.2825. A missing score is not a score of zero."
  trap: "Defensive COALESCE(x, 0) before an aggregate is a reflex ('so NULLs do not break the maths'). For AVG it changes the denominator: unscored suppliers count as perfectly safe, and the portfolio looks about 25 percent less risky than the scored suppliers say."


# ------------------------------------------------------------------ numeric strings, NULLs, text dates (finance)
- id: D-019
  family: d
  space: company
  question: "What is the longest supplier lead time in days?"
  model_sql: |-
    SELECT MAX(lead_time_days) AS max_lead_time_days
    FROM suppliers
  expect: answer
  gold_sql: |-
    SELECT MAX(CAST(lead_time_days AS INTEGER)) AS max_lead_time_days
    FROM suppliers
  gold_notes: "lead_time_days landed as VARCHAR holding integers ('7','12','5','9','10','6','14','3'). Numeric maximum 14 (Utara Resin). MAX over text compares bytes, so '9' > '7' > '6' > '5' > '3' > '14' > '12' > '10': the model returns '9'."
  trap: "A SQL source's INTEGER column is stringified on ingest. The column is still called lead_time_days, MAX is the obvious aggregate, and the value returned ('9') is a real cell and a bare integer: the envelope's money-in-prose check ignores bare integers, so it ships as 'max_lead_time_days=9'."

- id: D-020
  family: d
  space: finance
  ask_path: product
  question: "Which supplier has the longest lead time?"
  model_sql: |-
    SELECT supplier_name, lead_time_days
    FROM suppliers
    ORDER BY lead_time_days DESC
    LIMIT 1
  expect: answer
  gold_sql: |-
    SELECT supplier_name, CAST(lead_time_days AS INTEGER) AS lead_time_days
    FROM suppliers
    ORDER BY CAST(lead_time_days AS INTEGER) DESC, supplier_id
    LIMIT 1
  gold_notes: "Numeric order: Utara Resin 14 days is the longest. Byte order puts '9' first: the model names Orbit Packing (9 days)."
  trap: "ORDER BY the column DESC LIMIT 1 is the standard 'which X has the highest Y' query. With lead time stored as text the sort is lexicographic, so the supplier with '9' beats the one with '14' and '12'. Real supplier, real number, wrong winner."

- id: D-021
  family: d
  space: finance
  question: "What is the average supplier lead time in days?"
  model_sql: |-
    SELECT ROUND(AVG(CAST(lead_time_days AS INTEGER)), 0) AS avg_lead_time_days
    FROM suppliers
  expect: answer
  gold_sql: |-
    SELECT AVG(CAST(lead_time_days AS INTEGER)) AS avg_lead_time_days
    FROM suppliers
  gold_notes: "Mean of 7,12,5,9,10,6,14,3 = 66/8 = 8.25 days. The model rounds to whole days (8). LOW SEVERITY: display rounding; the question did not ask for rounding."
  trap: "Lead time is an integer-valued column and 'days' sounds whole, so a model rounds the mean to 0 decimals. The rounded value is not the figure the data supports (8.25), and the envelope cannot tell a rounded aggregate from an exact one."


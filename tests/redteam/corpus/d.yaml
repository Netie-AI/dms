    WHERE TRY_STRPTIME(next_audit_due, '%m/%d/%Y') < DATE '2026-12-01'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS audits_due
    FROM suppliers
    WHERE TRY_STRPTIME(next_audit_due, '%d/%m/%Y') < DATE '2026-12-01'
  gold_notes: "next_audit_due is day-first text (Malaysian locale): '25/08/2026', '30/11/2026' and '15/10/2026' prove it (no 25th month). Day-first: SUP-01 (5 Nov), SUP-02 (25 Aug), SUP-04 (30 Nov), SUP-07 (15 Oct) are before 2026-12-01 = 4; SUP-03 (3 Dec), SUP-05 (12 Jan 2027), SUP-08 (1 Dec, not before) are not. Month-first parsing (US default) turns 05/11 into May 11, 03/12 into Mar 12, 01/12 into Jan 12, and TRY_STRPTIME silently drops the three rows that cannot be month-first: 3."
  trap: "A model that must turn dd/mm/yyyy text into a date defaults to the US format and, having learned that plain strptime errors on '25/08/2026', switches to TRY_STRPTIME. The bad rows become NULL instead of an error, ambiguous rows are misread, and the count is off by one with no sign that three cells were dropped."

# ------------------------------------------------------------------ text money, dirty keys (finance)
- id: D-030
  family: d
  space: finance
  question: "What is the total value of outbound stock movements, quantity times unit cost?"
  model_sql: |-
    SELECT SUM(quantity_kg * TRY_CAST(unit_cost_myr AS DOUBLE)) AS outbound_value_myr
    FROM transactions
    WHERE LOWER(TRIM(txn_type)) = 'outbound'
  expect: answer
  gold_sql: |-
    SELECT SUM(quantity_kg * TRY_CAST(REPLACE(REPLACE(UPPER(unit_cost_myr), 'RM', ''), ' ', '') AS DOUBLE)) AS outbound_value_myr
    FROM transactions
    WHERE LOWER(TRIM(txn_type)) = 'outbound'
  gold_notes: "unit_cost_myr is text; T003 is hand-keyed 'RM 5.20', T007 is ' 12.00 ' (padded; casts fine), T012 is 'TBC' (unparseable, excluded by both). The only difference is T003: 200 kg x 5.20 = 1040 missing from the model figure. txn_type is normalised in both SQLs so only the money-text effect shows."
  trap: "SUM(qty * TRY_CAST(cost AS DOUBLE)) is the defensive way to multiply a text cost column. TRY_CAST is why the query does not crash on 'TBC' and 'RM 5.20', and it is also why the RM 5.20 row (1,040 of value) vanishes without trace. The model has already been careful about txn_type, which makes the query look robust."


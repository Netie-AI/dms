  gold_notes: "Normalised statuses: in_transit, delivered, delayed = 3 (NULL is not a status). Raw DISTINCT counts in_transit, delivered, DELIVERED, 'delivered ', delayed = 5."
  trap: "COUNT(DISTINCT col) is the direct reading. Case and padding variants of one status are distinct strings, so the count of categories is inflated by two. A small positive integer with no empty set and no shape problem."

- id: D-059
  family: d
  space: finance
  question: "How many transactions were there between 2026-07-01 and 2026-07-31?"
  model_sql: |-
    SELECT COUNT(*) AS july_transactions
    FROM transactions
    WHERE ts BETWEEN '2026-07-01' AND '2026-07-31'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS july_transactions
    FROM transactions
    WHERE ts >= TIMESTAMP '2026-07-01 00:00:00' AND ts < TIMESTAMP '2026-08-01 00:00:00'
  gold_notes: "ts is a TIMESTAMP. T004..T015 (12) + T016..T019 (4) + T020 (2026-07-31 14:00) = 17 transactions on days 2026-07-01 to 2026-07-31 inclusive. BETWEEN with a bare date as the upper bound means ts <= 2026-07-31 00:00:00, which silently drops the whole last day: 16."
  trap: "BETWEEN '2026-07-01' AND '2026-07-31' is the standard way to write 'in July' and it is correct for a DATE column. Against a TIMESTAMP column the date literal is coerced to midnight, so everything that happened during the last day is excluded. QUAL-GUARD sees a WHERE clause and a 2026 literal and is satisfied."

- id: D-060
  family: d
  space: company
  question: "How many transactions were there on 2026-07-01?"
  model_sql: |-
    SELECT COUNT(*) AS txns_on_day
    FROM transactions
    WHERE ts = '2026-07-01'
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS txns_on_day
    FROM transactions
    WHERE CAST(ts AS DATE) = DATE '2026-07-01'
  gold_notes: "T004 is at 2026-07-01 08:00, so 1 transaction happened on that day. Comparing the TIMESTAMP to the bare date compares to midnight exactly and matches nothing: COUNT(*) = 0."
  trap: "ts = '2026-07-01' reads naturally as 'on that day'. A timestamp equals a date only at 00:00:00, so the filter matches nothing; wrapped in COUNT(*) the result is a one-row 0, which hard rule 12 (empty result) does not demote."

- id: D-061
  family: d
  space: finance
  question: "What is the latest next audit due date among suppliers?"
  model_sql: |-
    SELECT MAX(next_audit_due) AS latest_next_audit_due
    FROM suppliers
  expect: answer
  gold_sql: |-
    SELECT MAX(CAST(STRPTIME(next_audit_due, '%d/%m/%Y') AS DATE)) AS latest_next_audit_due
    FROM suppliers
  gold_notes: "next_audit_due is day-first text ('25/08/2026' proves it). Parsed, the latest is 12 January 2027 (SUP-05). MAX over the text compares bytes: '30/11/2026' > '25/08/2026' > ... > '12/01/2027', so the model returns '30/11/2026'."
  trap: "MAX over a date-looking column is the literal reading of 'latest'. dd/mm/yyyy text sorts by day first, so any date late in a month beats a later month or year. The returned cell is a real, correctly formatted date from the table, so nothing looks off."

# ------------------------------------------------------------------ certified (demo-pack) phrases over dirty join keys
- id: D-062
  family: d
  space: ops
  ask_path: product
  question: "Which SKUs are below reorder level in warehouse A?"
  model_sql: |-
    SELECT i.sku, i.quantity_kg
    FROM inventory i
    JOIN locations l ON i.location_id = l.location_id
    WHERE i.quantity_kg < i.reorder_level_kg AND l.location_code = 'WH-A'
    ORDER BY i.quantity_kg ASC
  expect: answer
  gold_sql: |-
    SELECT i.sku, i.quantity_kg
    FROM inventory i
    JOIN locations l ON TRIM(i.location_id) = l.location_id
    WHERE i.quantity_kg < i.reorder_level_kg AND i.reorder_level_kg > 0 AND l.location_code = 'WH-A'
    ORDER BY i.quantity_kg ASC
  gold_notes: "Below reorder at WH-A: SKU-ZETA (50 < 300) and RS622XKR (80 < 200) = 2 SKUs. RS622XKR's inventory.location_id is the CHAR-padded 'WH-A ', so the governed query's equi-join to locations drops it: 1 SKU. This is a demo-pack phrase: the answer comes from the pack's own stored SQL (L1_GOVERNED_METRIC); model_sql is never used."
  trap: "A certified phrase answered by its stored SQL, whose join key is compared untrimmed. One padded key silently removes a below-reorder SKU from a governed answer, which then carries the governed-metric badge. The result is non-empty (SKU-ZETA), so hard rule 12 does not apply, and nothing in the gate re-checks the pack's SQL against the data it now runs on."

- id: D-063
  family: d
  space: finance
  ask_path: product
  question: "What is our total spend by supplier country?"
  model_sql: |-
    SELECT s.country, ROUND(SUM(i.quantity_kg * i.unit_cost_myr), 2) AS total_spend_myr
    FROM inventory AS i
    JOIN suppliers AS s ON i.supplier_id = s.supplier_id
    GROUP BY s.country
    ORDER BY total_spend_myr DESC, s.country ASC
  expect: answer
  gold_sql: |-
    SELECT s.country, ROUND(SUM(i.quantity_kg * i.unit_cost_myr), 2) AS total_spend_myr
    FROM inventory AS i
    JOIN suppliers AS s ON TRIM(i.supplier_id) = s.supplier_id
    GROUP BY s.country
    ORDER BY total_spend_myr DESC, s.country ASC
  gold_notes: "SKU-DELTA (60 kg x 6.40 = 384.00) belongs to SUP-02 (SG) but its inventory.supplier_id is the padded 'SUP-02 '. Correct spend: MY 20666, SG 7524 (7140 + 384), TH 1800. The pack's own SQL joins untrimmed and serves SG 7140, 384 short, under the governed-metric badge. model_sql is never used (exact pack phrase)."
  trap: "Governed (L1) spend figures are computed by a stored query whose join is an untrimmed equality. A padded foreign key drops the lot from its country's total with no error and no empty set; the SG row is still there and still plausible. Dirty keys from a CHAR(n) source are exactly what an all-VARCHAR ingest preserves."

- id: D-064
  family: d
  space: finance
  ask_path: product
  question: "What is our total spend?"
  model_sql: |-
    SELECT ROUND(COALESCE(SUM(i.quantity_kg * i.unit_cost_myr), 0), 2) AS total_spend_myr
    FROM inventory AS i
    JOIN suppliers AS s ON i.supplier_id = s.supplier_id
  expect: answer
  gold_sql: |-
    SELECT ROUND(COALESCE(SUM(i.quantity_kg * i.unit_cost_myr), 0), 2) AS total_spend_myr
    FROM inventory AS i
    JOIN suppliers AS s ON TRIM(i.supplier_id) = s.supplier_id
  gold_notes: "Total spend over all lots = 29990 (MY 20666 + SG 7524 + TH 1800). The pack's untrimmed join loses SKU-DELTA's 384: 29606."
  trap: "Same governed-query, padded-key mechanism as D-063 on the scalar total. The total is short by exactly one lot and prints as a clean 2-decimal ringgit figure."

- id: D-065
  family: d
  space: finance
  ask_path: product
  question: "What is total stock value by category?"
  model_sql: |-
    SELECT category, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS stock_value_myr
    FROM inventory
    GROUP BY category
    ORDER BY stock_value_myr DESC, category ASC
  expect: answer
  gold_sql: |-
    SELECT UPPER(TRIM(category)) AS category, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS stock_value_myr
    FROM inventory
    GROUP BY 1
    ORDER BY stock_value_myr DESC, category ASC
  gold_notes: "SKU-ZETA's category was hand-keyed 'Raw ' (capital R, trailing space): same category as 'RAW'. Correct: PACKAGING 15015, PARTS 7209, RAW 5966 (5400 + 416 + 150), CHEMICALS 1800. The governed query groups on the raw text: RAW 5816 and a separate 'Raw ' group of 150, five groups. This is a demo-pack phrase answered by its own stored SQL (L1_GOVERNED_METRIC); model_sql is never used."
  trap: "A certified group-by on a text key that has one case/space variant. The governed answer shows a spurious fifth category and an understated RAW total, with the governed-metric badge. Rows are non-empty and multi-row, so the shape checks (E10/E12) pass."

# ------------------------------------------------------------------ text-typed numbers compared column to column
- id: D-066
  family: d
  space: finance
  question: "How many warehouses are over capacity?"
  model_sql: |-
    SELECT COUNT(*) AS over_capacity
    FROM locations
    WHERE current_load_kg > capacity_kg
  expect: answer
  gold_sql: |-
    SELECT COUNT(*) AS over_capacity
    FROM locations
    WHERE CAST(current_load_kg AS DOUBLE) > CAST(capacity_kg AS DOUBLE)
  gold_notes: "capacity_kg and current_load_kg are both VARCHAR ('100000.0', '72000.0', ...). Numerically no warehouse is over capacity (loads 72000/100000, 45000/80000, 58000/60000, 31000/120000, 88000/90000): 0. Compared as strings, '72000.0' > '100000.0' and '31000.0' > '120000.0' (first character '7' > '1', '3' > '1'), so WH-A and WH-D are counted: 2."
  trap: "Comparing two columns needs no literal, so DuckDB does not demand a cast: VARCHAR > VARCHAR is accepted and compares bytes. 'over capacity' is the obvious load-versus-capacity predicate, and a model that has not registered that an all-VARCHAR ingest made both columns text writes exactly this. The answer is a small positive integer, so nothing about it looks empty or odd."

- id: D-067

    RANK() OVER (ORDER BY cost_myr DESC) AS rk FROM shipments) WHERE rk <= 3
  gold_notes: "Costs 820, 700, then SH-102 and SH-105 both 540. Top 3 by rank = 4 shipments."
  trap: "LIMIT 3 cuts a two-way tie at the third place; no ORDER BY tiebreak and no tie note."

- id: E-005
  family: e
  space: company
  question: "Which supplier has the most delayed shipments?"
  model_sql: >-
    SELECT s.supplier_name, COUNT(*) AS delayed_shipments
    FROM shipments sh JOIN inventory i ON i.sku = sh.sku
    JOIN suppliers s ON s.supplier_id = i.supplier_id
    WHERE sh.status = 'delayed' GROUP BY s.supplier_name
    ORDER BY delayed_shipments DESC LIMIT 1
  expect: answer
  gold_sql: >-
    WITH c AS (SELECT s.supplier_name, COUNT(*) AS delayed_shipments
    FROM shipments sh JOIN inventory i ON i.sku = sh.sku
    JOIN suppliers s ON s.supplier_id = i.supplier_id
    WHERE sh.status = 'delayed' GROUP BY s.supplier_name)
    SELECT supplier_name, delayed_shipments FROM c
    WHERE delayed_shipments = (SELECT MAX(delayed_shipments) FROM c)
  gold_notes: "shipments has no supplier_id; the supplier is reached through the SKU (inventory.sku is unique). Northshore Materials and Peninsula Polymers each have 2 delayed shipments: a tie."
  trap: "superlative over a group with LIMIT 1: the join path is right, the tie is invisible, one supplier is named as the worst."

- id: E-006
  family: e
  space: company

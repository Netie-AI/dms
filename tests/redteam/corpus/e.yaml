  trap: "none: control"
  control: true

- id: E-018
  family: e
  space: finance
  question: "Which warehouses do not hold any chemicals?"
  model_sql: >-
    SELECT DISTINCT l.location_code FROM locations l
    JOIN inventory i ON i.location_id = l.location_id
    WHERE i.category <> 'CHEMICALS'
  expect: answer
  gold_sql: >-
    SELECT location_code FROM locations
    WHERE location_id NOT IN (SELECT location_id FROM inventory WHERE category = 'CHEMICALS')
  gold_notes: "WH-A holds SKU-THETA (chemicals) next to raw stock; WH-C holds only chemicals; WH-F and WH-G hold nothing. Correct = WH-B, WH-D, WH-E, WH-F, WH-G. The join + <> form returns WH-A (wrong, it holds chemicals) and omits WH-F/WH-G (wrong, they hold none)."
  trap: "classic anti-join mistake: 'has no X' written as 'has some row that is not X'."

- id: E-019
  family: e
  space: finance
  question: "Which warehouses do not hold any chemicals?"
  model_sql: >-
    SELECT location_code FROM locations
    WHERE location_id NOT IN (SELECT location_id FROM inventory WHERE category = 'CHEMICALS')
  expect: answer
  gold_sql: >-
    SELECT location_code FROM locations
    WHERE location_id NOT IN (SELECT location_id FROM inventory WHERE category = 'CHEMICALS')
  gold_notes: "Same words as E-018, correct anti-join. The positive literal 'CHEMICALS' sits inside the NOT IN subquery."
  trap: "none: control. Over-abstention probe: a correct anti-join necessarily contains a positive filter on the negated concept."
  control: true


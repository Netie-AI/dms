# ---------------------------------------------------------------- negation and exclusion
- id: E-016
  family: e
  space: ops
  question: "How many shipments are not delayed?"
  model_sql: "SELECT COUNT(*) AS n FROM shipments WHERE status IN ('in_transit', 'delivered')"
  expect: answer
  gold_sql: "SELECT COUNT(*) AS n FROM shipments WHERE status <> 'delayed'"
  gold_notes: "Statuses: delayed 4, in_transit 2, delivered 2, cancelled 1. Not delayed = 5. The IN list enumerates the 'good' statuses and misses cancelled (4)."
  trap: "complement of a negation written as an enumerated positive list; an unlisted status (cancelled) falls out. E11 only looks for the negated word itself in a positive filter."

- id: E-017
  family: e
  space: ops
  question: "How many shipments are not delayed?"
  model_sql: "SELECT COUNT(*) AS n FROM shipments WHERE status <> 'delayed'"

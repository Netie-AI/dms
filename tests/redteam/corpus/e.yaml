- id: E-084
  family: e
  space: finance
  question: "Which cold storage location has the highest capacity?"
  model_sql: "SELECT location_code, capacity_kg FROM locations ORDER BY capacity_kg DESC LIMIT 1"
  expect: answer
  gold_sql: >-
    SELECT location_code, capacity_kg FROM locations
    WHERE is_cold_storage = TRUE AND capacity_kg = (SELECT MAX(capacity_kg) FROM locations WHERE is_cold_storage = TRUE)
  gold_notes: "Cold storage locations: WH-C (60000) and WH-F (90000). The highest capacity among them is WH-F. The unfiltered maximum is WH-D (120000), which is not cold storage."
  trap: "superlative with a hidden filter: 'cold storage' is dropped and the overall maximum is served as the answer."

- id: E-085
  family: e
  space: finance
  question: "Show the top 2 SKUs per warehouse by stock quantity"
  model_sql: >-
    SELECT sku, location_id, quantity_kg FROM inventory ORDER BY quantity_kg DESC LIMIT 2
  expect: answer
  gold_sql: >-
    SELECT sku, location_id, quantity_kg FROM (SELECT sku, location_id, quantity_kg,
    RANK() OVER (PARTITION BY location_id ORDER BY quantity_kg DESC) AS rk FROM inventory) WHERE rk <= 2
  gold_notes: "Top 2 within each warehouse: WH-A RS622XK, SKU-THETA; WH-B ALPHA, BETA; WH-C GAMMA; WH-D ETA, DELTA; WH-E EPSILON and ZETA (tied at rank 1) = 9 rows. A global LIMIT 2 returns the two biggest SKUs overall."
  trap: "per-group top-N written as a global ORDER BY ... LIMIT N: two rows come back, so the 'is it more than one row' shape check is satisfied. 'per warehouse' is not one of the extracted group-by needles ('by warehouse' is)."

- id: E-086
  family: e
  space: finance
  question: "Which SKU is the largest in each warehouse?"
  model_sql: >-
    SELECT location_id, MAX(quantity_kg) AS max_kg FROM inventory GROUP BY location_id
  expect: answer
  gold_sql: >-
    SELECT i.location_id, i.sku, i.quantity_kg FROM inventory i
    JOIN (SELECT location_id, MAX(quantity_kg) AS mx FROM inventory GROUP BY location_id) m
    ON m.location_id = i.location_id AND m.mx = i.quantity_kg
  gold_notes: "The question asks WHICH SKU: the answer must name the SKU in each warehouse (WH-E has a tie between SKU-EPSILON and SKU-ZETA, both 2100 kg). A grouped MAX returns only the number and loses the SKU."
  trap: "per-group argmax written as a grouped MAX: a plausible-looking table of numbers, no SKU named (the classic missing-argmax error)."

# ---------------------------------------------------------------- product ladder: rewrite and pre-gate behaviour
- id: E-053
  family: e
  space: finance
  ask_path: product
  question: "List the top 3 warehouses by capacity without excluding any cold storage"
  model_sql: >-
    SELECT sku, ROUND(SUM(quantity_kg * unit_cost_myr), 2) AS revenue_myr FROM transactions
    WHERE txn_type = 'outbound' GROUP BY sku ORDER BY revenue_myr DESC LIMIT 3
  expect: answer
  gold_sql: >-
    SELECT location_code, capacity_kg FROM (SELECT location_code, capacity_kg,
    RANK() OVER (ORDER BY capacity_kg DESC) AS rk FROM locations) WHERE rk <= 3
  gold_notes: "Any question containing 'top N' and a later 'without exclud...' is rewritten to 'Top N selling SKUs by revenue' before the ladder, so the model is asked a different question. model_sql is what a model would emit FOR THAT REWRITTEN question. Correct = WH-D 120000, WH-A and WH-G 100000."
  trap: "question rewriter (decline-chip normaliser) replaces the whole user question; the answer is about SKU revenue, the user asked about warehouse capacity."


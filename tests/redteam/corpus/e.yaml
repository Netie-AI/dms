  model_sql: >-
    SELECT severity, COUNT(*) AS n FROM alerts GROUP BY severity
    ORDER BY n DESC LIMIT 1
  expect: answer
  gold_sql: >-
    WITH c AS (SELECT severity, COUNT(*) AS n FROM alerts GROUP BY severity)
    SELECT severity, n FROM c WHERE n = (SELECT MAX(n) FROM c)
  gold_notes: "high, medium and low each appear twice: a three-way tie. Correct answer lists all three (or says there is no single most common severity)."
  trap: "mode via LIMIT 1 when all categories tie: the served severity is whichever sorts first."

- id: E-007
  family: e
  space: finance
  question: "Which vendor has the highest risk score?"
  model_sql: >-
    SELECT supplier_name, risk_score FROM (SELECT supplier_name, risk_score,
    ROW_NUMBER() OVER (ORDER BY risk_score DESC) AS rn FROM suppliers) t WHERE rn = 1
  expect: answer
  gold_sql: "SELECT supplier_name, risk_score FROM suppliers WHERE risk_score = (SELECT MAX(risk_score) FROM suppliers)"
  gold_notes: "vendor = supplier. Orbit Packing and Zenith Resin both 0.55. ROW_NUMBER() = 1 picks one of two tied suppliers."
  trap: "synonym (vendor -> suppliers) plus ROW_NUMBER() = 1, which breaks ties arbitrarily where RANK() would not."


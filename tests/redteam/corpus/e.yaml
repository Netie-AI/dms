  gold_notes: "Same question as E-005. shipments has no supplier column; the model joins through the shared location instead of the shared SKU, so each shipment is matched to every item stored at its destination warehouse (fan-out and wrong attribution): Northshore 6 instead of a 2-2 tie."
  trap: "superlative over a group where the group key is reached through a guessed join (location instead of SKU)."

- id: E-080
  family: e
  space: finance
  question: "What is the total current load of all locations except cold storage?"
  model_sql: "SELECT SUM(current_load_kg) AS total_load_kg FROM locations"
  expect: answer
  gold_sql: "SELECT SUM(current_load_kg) AS total_load_kg FROM locations WHERE is_cold_storage = FALSE"
  gold_notes: "Cold storage locations are WH-C (58000) and WH-F (88000). Total over all 7 = 472000; excluding cold = 326000. 'except' is outside the negation marker list and the clause names an attribute, not a quoted value."
  trap: "exclusion introduced by 'except' is dropped entirely; no filter atom exists in the SQL for the polarity check to inspect."


# Family E: wording traps (synonyms, negation, excluding, top-N ties, inclusive/exclusive comparatives, superlatives).
# Extension data: e.ext.sql (ties, boundary values, a 3rd txn_type, a 4th shipment status, an empty warehouse,
# a supplier with no stock, chemicals inside a warehouse that also holds non-chemicals).
# model_sql is INFERRED (what a model could plausibly emit); nothing here was observed from a model.

# ---------------------------------------------------------------- ties: highest / most / top-N
- id: E-001
  family: e
  space: finance
  question: "Which SKU has the highest stock quantity?"
  model_sql: "SELECT sku, quantity_kg FROM inventory ORDER BY quantity_kg DESC LIMIT 1"
  expect: answer
  gold_sql: "SELECT sku, quantity_kg FROM inventory WHERE quantity_kg = (SELECT MAX(quantity_kg) FROM inventory)"
  gold_notes: "SKU-ALPHA and SKU-ETA both hold 3400 kg. 'Which SKU has the highest' with a tie: correct handling returns both tied rows (or states the tie), not one arbitrary row."
  trap: "textbook ORDER BY ... LIMIT 1 for a superlative; a model does not know the maximum is shared, so one of two tied rows is served as THE answer."

- id: E-002
  family: e
  space: finance
  question: "Which SKU has the highest stock quantity?"
  model_sql: "SELECT sku, quantity_kg FROM inventory WHERE quantity_kg = (SELECT MAX(quantity_kg) FROM inventory)"
  expect: answer
  gold_sql: "SELECT sku, quantity_kg FROM inventory WHERE quantity_kg = (SELECT MAX(quantity_kg) FROM inventory)"
  gold_notes: "Same words as E-001; the tie-aware SQL. Measures whether the correct tied answer is served or demoted."
  trap: "none: control"
  control: true

- id: E-003
  family: e
  space: finance
  question: "Who are our top 3 SKUs by stock quantity?"
  model_sql: >-
    SELECT sku, SUM(quantity_kg) AS total_kg FROM inventory GROUP BY sku
    ORDER BY total_kg DESC LIMIT 3
  expect: answer
  gold_sql: >-
    SELECT sku, total_kg FROM (SELECT sku, SUM(quantity_kg) AS total_kg,
    RANK() OVER (ORDER BY SUM(quantity_kg) DESC) AS rk FROM inventory GROUP BY sku) WHERE rk <= 3
  gold_notes: "Ranks 1-2 are the 3400 kg tie (ALPHA, ETA); rank 3 is the 2100 kg tie (EPSILON, ZETA). Top 3 by rank is FOUR rows; LIMIT 3 silently drops one of the two 2100 kg SKUs."
  trap: "the cut falls inside a tie: the 3rd and 4th SKU have identical quantity, LIMIT 3 keeps whichever the engine happened to sort first and says nothing."

- id: E-004
  family: e
  space: ops
  question: "Show the top 3 most expensive shipments"
  model_sql: "SELECT shipment_id, cost_myr FROM shipments ORDER BY cost_myr DESC LIMIT 3"
  expect: answer
  gold_sql: >-

  expect: answer
  gold_sql: >-
    WITH c AS (SELECT s.supplier_name, COUNT(*) AS item_count FROM inventory i
    JOIN suppliers s ON s.supplier_id = i.supplier_id GROUP BY s.supplier_name)
    SELECT supplier_name, item_count FROM c WHERE item_count = (SELECT MAX(item_count) FROM c)
  gold_notes: "Northshore Materials and Delta Logistics Co each supply 3 items. The tie-correct answer has 2 rows and a GROUP BY in a question containing the word 'count'."
  trap: "none: control. Over-abstention probe: the correct tie answer is a 2-row grouped result for a question with the word 'count' (E12 scalar-got-ranking shape)."
  control: true

